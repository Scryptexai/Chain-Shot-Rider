; Export presets for Chain Rider.
;
; Committed on purpose. Export settings decide the shipped build's size,
; renderer and permissions, so they belong in review like any other code.
; Kept out of an editor's hands where possible: the values below follow the
; budgets in docs/08-optimization-checklist.md (build < 100 MB, RAM < 200 MB,
; portrait only, no features the game does not use).
;
; Android release needs a keystore, which is deliberately NOT stored here.
; Point the editor or the environment at your own before exporting.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/android/chainrider.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="34"
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.3.0"
package/unique_name="ai.arena.chainrider"
package/name="Chain Rider"
package/signed=true
package/app_category=0
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/internet=false

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Tanpa thread: build yang memakai SharedArrayBuffer menuntut header
; COOP+COEP dari server, dan GitHub Pages tidak bisa mengirimkannya — build
; berulir akan menolak jalan di sana dan di Safari iOS. Template yang dipakai
; adalah web_nothreads_debug.zip / web_nothreads_release.zip.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

