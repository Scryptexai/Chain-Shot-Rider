// =============================================================================
// RENDER — proyeksi 2.5D
// =============================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// Kerangka acuan tetap. Semua gambar dan seluruh CSS memakai koordinat ini;
// layar nyata hanya menskalakannya. Rasio 9:16 karena itulah spesifikasinya,
// dan karena rasio yang berubah-ubah berarti framing kamera berubah-ubah juga.
const REF_W = 1080, REF_H = 1920;
// Layar ponsel modern lebih jangkung dari 9:16 (umumnya 19,5:9 sampai 20:9).
// Memaksa 9:16 di sana berarti dua pita hitam permanen, dan itu terbaca seperti
// halaman web yang dipaksa, bukan game. Jadi: LEBAR yang dikunci ke 1080, tinggi
// boleh tumbuh sampai batas ini, dan ruang ekstra jatuh ke dek HUD atas/bawah —
// kamera tetap membingkai lorong dengan bukaan horizontal yang sama.
const REF_H_MAX = 2340;                      // ~9:19.5
let W=REF_W, H=REF_H, FIT_K=1, DPR=1;

/**
 * Memasang kerangka acuan ke layar nyata.
 *   layar lebih jangkung dari 9:16 -> cocokkan lebar, tinggi acuan ikut tumbuh
 *   layar lebih lebar (desktop)     -> cocokkan tinggi, sisanya jadi backdrop
 *
 * Ini perbaikan inti dari keluhan "resolusinya tidak jelas landscape atau
 * portrait": sebelumnya #stage memakai height:100% + aspect-ratio sehingga di
 * ponsel tinggi menang dan rasionya jadi 0,46 sementara kamera 3D dibangun
 * untuk 9:16. Sekarang rasio dan skala ditentukan di satu tempat saja.
 */
function fitFrame(){
  const frame = document.getElementById('frame');
  const vw = (window.innerWidth || REF_W), vh = (window.innerHeight || REF_H);
  const portraitish = (vh / vw) >= (REF_H / REF_W);
  let k, hRef;
  if(portraitish){
    k = vw / REF_W;
    hRef = Math.min(REF_H_MAX, Math.round(vh / k));
  } else {
    k = vh / REF_H;
    hRef = REF_H;
  }
  FIT_K = k; H = hRef; W = REF_W;
  if(frame && frame.style){
    frame.style.height = hRef + 'px';
    frame.style.setProperty('--k', String(k));
    // Bingkai menutup layar penuh -> sudut membulat dan bayangan luar hanya
    // mengotori tepi, jadi dimatikan.
    const full = Math.abs(k*REF_W - vw) < 2 && Math.abs(k*hRef - vh) < 2;
    if(frame.classList) frame.classList.toggle('full', full);
  }
  return k;
}

function resize(){
  const k = fitFrame() || 1;
  // Buffer gambar mengikuti piksel fisik yang benar-benar tampil, bukan 1080
  // mentah: di desktop k kecil, jadi merender 1080 penuh hanya membuang GPU.
  DPR = Math.max(0.6, Math.min(2, (window.devicePixelRatio||1) * k));
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  if(R3D_ON) R3D.resize(W*DPR, H*DPR);
}
window.addEventListener('resize', resize);
if(window.visualViewport && window.visualViewport.addEventListener)
  window.visualViewport.addEventListener('resize', resize);

// Proyeksi: makin jauh (z besar) → makin kecil & makin ke atas layar.
// Ini meniru kamera perspektif miring 40° tanpa 3D engine.
/**
 * Hitung polyline jalur peluru dengan memantulkan dinding saja (abaikan musuh).
 * Dipakai untuk aim indicator. Mirror dari RicochetSolver.PredictWallPath (Unity).
 */
function predictAimPath(x, z, dx, dz, maxBounces){
  // Batas HARUS sama persis dengan yang dipakai simulate(), kalau tidak
  // indicator akan berbohong. Sumber: CFG.arena.xMin/xMax/zMin/zMax.
  const A = CFG.arena, rb = CFG.bullet.radius;
  const xL = A.xMin + rb, xR = A.xMax - rb, zTop = A.zMax - rb, zBot = A.zMin;
  const topAbsorbs = A.walls.top.absorbsBullet !== false;
  const pts = [[x,z]];
  let bounces = 0, guard = 0;
  while(bounces <= maxBounces && guard++ < 24){
    // jarak ke dinding samping
    let tX = Infinity;
    if(dx >  1e-6) tX = (xR - x)/dx;
    if(dx < -1e-6) tX = (xL - x)/dx;
    // jarak ke dinding atas / bawah
    let tZ = Infinity;
    if(dz >  1e-6) tZ = (zTop - z)/dz;
    if(dz < -1e-6) tZ = (zBot - z)/dz;
    const t = Math.min(tX, tZ);
    if(!isFinite(t) || t <= 0) break;
    x += dx*t; z += dz*t;
    pts.push([x,z]);
    if(t === tZ && dz > 0 && topAbsorbs) break;     // keluar lewat spawn gate
    if(t === tZ && dz < 0) break;                   // kembali ke garis player
    if(t === tX) dx = -dx; else dz = -dz;
    bounces++;
  }
  return pts;
}

function proj(x, z){
  const zn = Math.max(0, Math.min(1.08, z / CFG.arena.height));
  const persp = 1 / (1 + zn*1.25);                 // faktor perspektif
  const sy = H*0.97 - Math.pow(zn,0.82) * H*0.90 * S.fov;
  const sx = W*0.5 + x * (W*0.042) * persp * (2-S.fov);
  return [sx, sy, persp];
}

function draw(){
  // WebGL is the real renderer. The 2D path below stays as a fallback for
  // machines without WebGL and for the headless harness, which has no GPU.
  if(R3D_ON){ R3D.sync(S, CFG, RENDER_ALPHA); return; }
  setSquadLabel();
  const v = CFG.variants[S.variant], th = v.theme;
  ctx.save(); ctx.scale(DPR,DPR);

  // shake
  const sh = S.shake>0 ? S.shake : 0;
  ctx.translate((Math.random()-.5)*sh*22, (Math.random()-.5)*sh*14);  // kosmetik: shake render

  // background gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, th.bgTop); g.addColorStop(1, th.bgBottom);
  ctx.fillStyle = g; ctx.fillRect(-40,-40,W+80,H+80);

  // ---- lantai: trapezoid + grid neon ----
  const A=proj(CFG.arena.xMin,0), B=proj(CFG.arena.xMax,0),
        C=proj(CFG.arena.xMax,CFG.arena.height), D=proj(CFG.arena.xMin,CFG.arena.height);
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.lineTo(D[0],D[1]); ctx.closePath();
  ctx.fillStyle = 'rgba(8,16,34,.75)'; ctx.fill();

  ctx.strokeStyle = hexA(th.grid, .16); ctx.lineWidth = 1;
  for(let z=0; z<=40; z+=2){ const p1=proj(-10,z), p2=proj(10,z);
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke(); }
  for(let x=-10; x<=10; x+=2){ const p1=proj(x,0), p2=proj(x,40);
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke(); }

  // ---- dinding bumper kiri/kanan ----
  ctx.lineWidth=3; ctx.strokeStyle=th.bumper; ctx.shadowColor=th.bumper; ctx.shadowBlur=18;
  [[-10],[10]].forEach(([x])=>{ const p1=proj(x,0), p2=proj(x,40);
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke(); });

  // ---- spawn gate ----
  ctx.strokeStyle = hexA(th.enemy,.55); ctx.shadowColor=th.enemy;
  { const p1=proj(-10,40), p2=proj(10,40);
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke(); }

  // ---- garis pertahanan ----
  const dz = CFG.arena.defenseLineZ, d1=proj(-10,dz), d2=proj(10,dz);
  ctx.strokeStyle = th.primary; ctx.shadowColor = th.primary; ctx.shadowBlur=22; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.moveTo(d1[0],d1[1]); ctx.lineTo(d2[0],d2[1]); ctx.stroke();
  ctx.shadowBlur=0;

  // ---- obstacle ----
  for(const o of S.obstacles){
    if(!o.alive) continue;
    const p = proj(o.x,o.z);
    if(o.kind==='gravityWell'){
      const rr = o.r*(W*0.042)*p[2];
      const gg = ctx.createRadialGradient(p[0],p[1],2,p[0],p[1],rr);
      gg.addColorStop(0,hexA(th.bumper,.55)); gg.addColorStop(1,hexA(th.bumper,0));
      ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*.45,0,0,6.283); ctx.fill();
      ctx.strokeStyle=hexA(th.bumper,.6); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*.45,0,0,6.283); ctx.stroke();
    } else if(o.kind==='movingPlatform'){
      const hw=o.w/2*(W*0.042)*p[2];
      ctx.fillStyle=hexA(th.bumper,.8); ctx.shadowColor=th.bumper; ctx.shadowBlur=14;
      roundRect(p[0]-hw,p[1]-5*p[2],hw*2,10*p[2],4); ctx.fill(); ctx.shadowBlur=0;
    } else if(o.kind==='shieldWall'){
      const hw=o.w/2*(W*0.042)*p[2];
      ctx.fillStyle=hexA('#FFC93C',.75); ctx.fillRect(p[0]-hw,p[1]-4*p[2],hw*2,8*p[2]);
    } else if(o.kind==='barrel'){
      const rr=0.6*(W*0.042)*p[2];
      ctx.fillStyle='#FF8A2B'; ctx.shadowColor='#FF8A2B'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*.7,0,0,6.283); ctx.fill(); ctx.shadowBlur=0;
    } else {
      const rr=o.r*(W*0.042)*p[2];
      const gg=ctx.createRadialGradient(p[0]-rr*.3,p[1]-rr*.4,rr*.1,p[0],p[1],rr);
      gg.addColorStop(0,'#FFFFFF'); gg.addColorStop(.35,th.bumper); gg.addColorStop(1,shade(th.bumper,-45));
      ctx.fillStyle=gg; ctx.shadowColor=th.bumper; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*.72,0,0,6.283); ctx.fill(); ctx.shadowBlur=0;
    }
  }

  // ---- musuh (urut dari jauh ke dekat = painter's algorithm) ----
  const sorted = S.enemies.slice().sort((a,b)=>b.z-a.z);
  for(const e of sorted){
    // Enemies spawn past the far wall (baseZ = height+1, plus formation
    // depth) and proj() clamps zn at 1.08, so everything beyond z=43 lands on
    // one screen row and stacks into an unreadable slab above the horizon.
    // Fade them in over the last few units so they emerge from the far wall
    // instead. Cosmetic only: the sim still ticks them, so replays are
    // bit-identical either way.
    // The ramp is wide on purpose. proj() crushes z=33..43 into the top ~19%
    // of the screen, so a full-brightness wave there is a solid unreadable
    // slab. Ramping across eight units turns the spawn zone into a depth
    // gradient: enemies resolve out of the haze well before z=34, which is
    // still ~29 units of warning ahead of the defense line at z=5.
    const fade = Math.min(1, Math.max(0, (CFG.arena.height + 2 - e.z) / 8));
    if(fade <= 0.02) continue;
    ctx.globalAlpha = fade;
    const p = proj(e.x,e.z);
    const s = (W*0.042)*p[2]*e.r*1.9;
    // blob shadow
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(p[0],p[1]+s*.5,s*.75,s*.28,0,0,6.283); ctx.fill();
    // body
    ctx.fillStyle = e.hit>0 ? '#FFFFFF' : e.color;
    ctx.shadowColor = e.color; ctx.shadowBlur = 8*p[2];
    roundRect(p[0]-s*.5, p[1]-s*1.15, s, s*1.5, s*.32); ctx.fill();
    ctx.shadowBlur=0;
    // rim light
    ctx.strokeStyle='rgba(255,220,120,.55)'; ctx.lineWidth=1;
    roundRect(p[0]-s*.5, p[1]-s*1.15, s, s*1.5, s*.32); ctx.stroke();
    // armor marker
    if(e.armored){ ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.fillRect(p[0]-s*.36,p[1]-s*1.02,s*.72,s*.16); }
  }
  ctx.globalAlpha = 1;

  // ---- gate matematika ----
  for(const g of S.gates){
    for(const sideKey of ['left','right']){
      const side = g[sideKey];
      const x0 = sideKey==='left' ? -CFG.arena.width/2 : CFG.gates.centerGapX/2;
      const x1 = sideKey==='left' ? -CFG.gates.centerGapX/2 : CFG.arena.width/2;
      const a=proj(x0,g.z), b=proj(x1,g.z);
      const done = g.squadDone;
      ctx.fillStyle = side.positive
        ? `rgba(64,196,255,${done?0.12:0.30})` : `rgba(255,82,92,${done?0.12:0.30})`;
      ctx.fillRect(a[0], a[1]-26*a[2], b[0]-a[0], 30*a[2]);
      ctx.strokeStyle = side.positive ? 'rgba(120,225,255,.85)' : 'rgba(255,130,140,.85)';
      ctx.lineWidth=2; ctx.strokeRect(a[0], a[1]-26*a[2], b[0]-a[0], 30*a[2]);
      const sym = {mul:'x',add:'+',sub:'-',div:'/'}[side.op] || '?';
      ctx.fillStyle='#fff'; ctx.font=`700 ${Math.max(13,20*a[2])}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(sym+side.value, (a[0]+b[0])/2, a[1]-11*a[2]);
    }
  }

  // ---- aim indicator: lurus ke depan dari posisi squad ----
  if(S.state==='playing' && !S.bullets.some(b=>b.riding)){
    const path = predictAimPath(S.squadX,
                                CFG.arena.playerSpawn.z + CFG.arena.muzzleOffset.z,
                                0, 1, CFG.aim.indicatorBounces);
    ctx.save(); ctx.setLineDash([9,9]); ctx.lineCap='round';
    for(let i=0;i<path.length-1;i++){
      const p0=proj(path[i][0],path[i][1]), p1=proj(path[i+1][0],path[i+1][1]);
      ctx.strokeStyle='rgba(120,255,225,'+(0.55/(i+1)).toFixed(3)+')';
      ctx.lineWidth = 3.5/(i*0.6+1);
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
      if(i>0){ // titik pantul
        ctx.setLineDash([]); ctx.fillStyle='rgba(120,255,225,.5)';
        ctx.beginPath(); ctx.arc(p0[0],p0[1],3.5,0,6.283); ctx.fill(); ctx.setLineDash([9,9]);
      }
    }
    ctx.restore();
  }

  // ---- boss ----
  if(S.boss){
    for(const part of S.boss.parts){
      if(!part.alive) continue;
      const p = proj(part.x, part.z), rr = part.r*(W*0.042)*p[2];
      ctx.fillStyle='rgba(0,0,0,.4)';
      ctx.beginPath(); ctx.ellipse(p[0],p[1]+rr*.5,rr*.9,rr*.32,0,0,6.283); ctx.fill();
      const gg=ctx.createRadialGradient(p[0]-rr*.3,p[1]-rr*.4,rr*.1,p[0],p[1],rr);
      gg.addColorStop(0, part.hit>0?'#FFFFFF':'#FF9A6A');
      gg.addColorStop(.5,'#FF3D2E'); gg.addColorStop(1,'#7A0E14');
      ctx.fillStyle=gg; ctx.shadowColor='#FF3D2E'; ctx.shadowBlur=30;
      ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*.95,0,0,6.283); ctx.fill(); ctx.shadowBlur=0;
      // indikator perisai
      if(!S.boss.vulnerable || S.boss.pattern==='orbit_pull_pulse'){
        ctx.strokeStyle='rgba(120,220,255,.85)'; ctx.lineWidth=4;
        const a0 = S.boss.pattern==='orbit_pull_pulse' ? part.shieldAngle-0.9 : -2.6;
        ctx.beginPath(); ctx.arc(p[0],p[1],rr*1.15,a0,a0+1.8); ctx.stroke();
      }
    }
  }

  // ---- peluru + trail ----
  for(const b of S.bullets){
    if(b.trail.length>1){
      ctx.lineCap='round';
      for(let i=1;i<b.trail.length;i++){
        const p1=proj(b.trail[i-1][0],b.trail[i-1][1]), p2=proj(b.trail[i][0],b.trail[i][1]);
        const a=i/b.trail.length;
        ctx.strokeStyle=hexA(th.primary, a*0.8); ctx.lineWidth=1+a*5;
        ctx.shadowColor=th.primary; ctx.shadowBlur=12*a;
        ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
      }
      ctx.shadowBlur=0;
    }
    if(!b.alive) continue;
    const p=proj(b.x,b.z), rr=Math.max(3, 0.3*(W*0.042)*p[2]);
    ctx.fillStyle='#FFFFFF'; ctx.shadowColor=th.primary; ctx.shadowBlur=26;
    ctx.beginPath(); ctx.arc(p[0],p[1],rr,0,6.283); ctx.fill(); ctx.shadowBlur=0;
  }

  // ---- FX ----
  for(const f of S.fx){
    const p=proj(f.x,f.z), k=1-f.t/f.max;
    if(f.kind==='bounce'||f.kind==='ripple'){
      ctx.strokeStyle=hexA(f.kind==='ripple'?th.primary:th.bumper, 1-k);
      ctx.lineWidth=3*(1-k);
      ctx.beginPath(); ctx.ellipse(p[0],p[1],(8+k*46)*p[2],(4+k*22)*p[2],0,0,6.283); ctx.stroke();
    } else if(f.kind==='kill'){
      ctx.fillStyle=hexA(f.color||'#FF4D3D',1-k);
      ctx.beginPath(); ctx.arc(p[0],p[1],(10*(1-k)+2)*p[2],0,6.283); ctx.fill();
    } else if(f.kind==='boom'){
      const rr=(10+k*90)*p[2];
      const gg=ctx.createRadialGradient(p[0],p[1],1,p[0],p[1],rr);
      gg.addColorStop(0,`rgba(255,240,180,${(1-k)*.9})`);
      gg.addColorStop(.5,`rgba(255,120,40,${(1-k)*.6})`);
      gg.addColorStop(1,'rgba(255,60,0,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(p[0],p[1],rr,rr*.55,0,0,6.283); ctx.fill();
    }
  }

  // ---- floating text ----
  ctx.font='700 15px system-ui'; ctx.textAlign='center';
  for(const f of S.floats){
    const p=proj(f.x+(f.jx||0),f.z);
    ctx.fillStyle=`rgba(255,213,79,${Math.min(1,f.t/0.8)})`;
    ctx.fillText(f.raw ? f.v : '+'+f.v, p[0], p[1]-14);
  }

  // ---- auto-fire tracers ----
  for(const b of S.autoBullets){
    const q = proj(b.x, b.z), r = Math.max(1.5, W*0.006*q[2]);
    ctx.fillStyle='rgba(255,241,168,.95)';
    ctx.beginPath(); ctx.arc(q[0],q[1],r,0,6.283); ctx.fill();
  }

  // ---- squad ----
  const shown = Math.min(S.troops, 24);
  for(let i=0;i<shown;i++){
    const col=i%5, row=(i/5)|0;
    const tx = S.squadX + (col-2)*0.42, tz = CFG.arena.playerSpawn.z - row*0.42;
    const q = proj(tx,tz), r = Math.max(2, W*0.011*q[2]);
    ctx.fillStyle = i===0 ? th.primary : hexA(th.primary,.75);
    ctx.beginPath(); ctx.arc(q[0],q[1]-r,r,0,6.283); ctx.fill();
  }

  // ---- player glow ----
  const pp = proj(S.squadX, CFG.arena.playerSpawn.z);
  const ps = W*0.042*pp[2]*1.5;
  const pg = ctx.createRadialGradient(pp[0],pp[1],2,pp[0],pp[1],ps*2.6);
  pg.addColorStop(0,hexA(th.primary,.5)); pg.addColorStop(1,hexA(th.primary,0));
  ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(pp[0],pp[1],ps*2.6,0,6.283); ctx.fill();
  ctx.fillStyle=th.primary; ctx.shadowColor=th.primary; ctx.shadowBlur=24;
  ctx.beginPath(); ctx.moveTo(pp[0],pp[1]-ps*1.1); ctx.lineTo(pp[0]+ps*.7,pp[1]+ps*.6);
  ctx.lineTo(pp[0]-ps*.7,pp[1]+ps*.6); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;

  ctx.restore();
}

function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hexA(hex,a){ const h=hex.replace('#',''); const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function shade(hex,amt){ const h=hex.replace('#',''); const n=parseInt(h,16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)));
  return `rgb(${c[0]},${c[1]},${c[2]})`; }
function addFx(x,z,kind,color){ if(S.fx.length>200) return;
  const dur = kind==='boom'?0.45:(kind==='kill'?0.3:0.22);
  S.fx.push({x,z,kind,color,t:dur,max:dur}); }

const el = {
  score:document.getElementById('score'), combo:document.getElementById('combo'),
  wave:document.getElementById('wave'), ammo:document.getElementById('ammo'),
  hp:document.getElementById('hp'), steerRow:document.getElementById('steerRow'),
  steerFill:document.getElementById('steerFill'), steerSec:document.getElementById('steerSec'),
  popup:document.getElementById('popup'), banner:document.getElementById('banner'),
  flash:document.getElementById('flash'), vig:document.getElementById('vig'),
  hint:document.getElementById('hint'), squad:document.getElementById('squad'),
  bossBar:document.getElementById('bossBar'), bossName:document.getElementById('bossName'),
  bossFill:document.getElementById('bossFill'),
  stageTag:document.getElementById('stageTag'), waveDots:document.getElementById('waveDots'),
  squadPod:document.getElementById('squadPod'), fireBtn:document.getElementById('btnFire'),
  pauseBtn:document.getElementById('btnPause'), hud:document.getElementById('hud'),
};
// Count-up tween (docs/06): angka tumbuh 0,2 s supaya kenaikan skor terbaca
// sebagai "diraih", bukan sekadar berganti. Murni kosmetik — nilai sebenarnya
// tetap S.score, jadi simulasi dan determinisme tidak tersentuh sama sekali.
const SCORE_TWEEN_SECONDS = 0.2;
const scoreView = { shown:0, from:0, to:0, t:SCORE_TWEEN_SECONDS };
function easeOutCubic(k){ const u = 1-k; return 1 - u*u*u; }
function paintScore(){
  if(el && el.score) el.score.textContent = Math.round(scoreView.shown).toLocaleString('en-US');
}
function setScore(instant){
  const to = S.score;
  // Turun berarti stage baru / reset: jangan dianimasikan mundur.
  if(instant || to < scoreView.shown){
    scoreView.shown = scoreView.from = scoreView.to = to;
    scoreView.t = SCORE_TWEEN_SECONDS;
  } else if(to !== scoreView.to){
    scoreView.from = scoreView.shown; scoreView.to = to; scoreView.t = 0;
  }
  paintScore();
}
function tickScoreView(realDt){
  if(scoreView.t >= SCORE_TWEEN_SECONDS) return;
  scoreView.t = Math.min(SCORE_TWEEN_SECONDS, scoreView.t + realDt);
  const k = easeOutCubic(scoreView.t / SCORE_TWEEN_SECONDS);
  scoreView.shown = scoreView.from + (scoreView.to - scoreView.from)*k;
  paintScore();
}

/**
 * Count-up bertahap untuk layar result: tiap baris mulai 0,15 s setelah baris
 * di atasnya (docs/06 baris 141). Memakai rAF sendiri, bukan loop permainan,
 * karena layar ini hidup saat state 'menu'. Hormati prefers-reduced-motion.
 */
const RESULT_ROW_STAGGER = 0.15, RESULT_COUNT_SECONDS = 0.45;
function runCountUp(root){
  const nums = Array.prototype.slice.call(root.querySelectorAll('[data-count]'));
  if(!nums.length) return;
  const paint = (node,v)=>{ node.textContent = Math.round(v).toLocaleString('en-US'); };
  const reduced = typeof matchMedia === 'function'
    && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced || typeof requestAnimationFrame !== 'function'){
    nums.forEach(node=>paint(node, +node.dataset.count));   // tetap terbaca tanpa animasi
    return;
  }
  nums.forEach(node=>paint(node, 0));
  const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  (function step(now){
    let done = true;
    nums.forEach((node,i)=>{
      const to = +node.dataset.count;
      const t = (now - t0)/1000 - i*RESULT_ROW_STAGGER;
      if(t < 0){ done = false; return; }
      const k = Math.min(1, t/RESULT_COUNT_SECONDS);
      paint(node, to*easeOutCubic(k));
      if(k < 1) done = false;
    });
    if(!done) requestAnimationFrame(step);
  })(t0);
}
function setCombo(){
  const on = S.combo > 1;
  el.combo.textContent = on ? ('x'+S.combo) : '';
  el.combo.classList.toggle('on', on);
  el.combo.style.transform = on ? 'scale(1.2)' : 'scale(.8)';
  setTimeout(()=>{ el.combo.style.transform = on ? 'scale(1)' : 'scale(.8)'; }, 90);
}
/**
 * Label wave punya dua bagian: chip teks dan titik progres. Titiknya ada karena
 * "WAVE 3/5" memaksa pemain membaca angka; lima titik bisa ditangkap dengan

 */

}
function setSquadLabel(){

}
function setAmmo(){

}
function setAmmoOld(){ el.ammo.innerHTML = Array.from({length:CFG.bullet.magazine},
  (_,i)=>`<i class="${i<S.ammo?'f':''}"></i>`).join(''); }
function setHp(){ el.hp.innerHTML = Array.from({length:CFG.player.lives},

// Petunjuk kontrol muncul sebagai toast dan pergi sendiri setelah beberapa
// detik, atau saat pemain menembak pertama kali. Teks permanen di layar main
// adalah dokumentasi, bukan desain.
let hintTimer = 0;
function showHint(){
  if(!el.hint || !el.hint.style) return;
  el.hint.style.opacity = '1';
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(hideHint, 6000);
}
function hideHint(){
  if(!el.hint || !el.hint.style) return;
  el.hint.style.opacity = '0';
  if(hintTimer){ clearTimeout(hintTimer); hintTimer = 0; }
}
function flashPopup(txt){ el.popup.textContent=txt; el.popup.style.transition='none';
  el.popup.style.opacity='1'; el.popup.style.transform='scale(1.25)';
  requestAnimationFrame(()=>{ el.popup.style.transition='opacity .6s, transform .35s';
    el.popup.style.opacity='0'; el.popup.style.transform='scale(1)'; }); }
function flashScreen(){ el.flash.style.transition='none'; el.flash.style.opacity='.55';
  requestAnimationFrame(()=>{ el.flash.style.transition='opacity .45s'; el.flash.style.opacity='0'; }); }
function banner(txt,color){ el.banner.textContent=txt; el.banner.style.color=color||'#fff';
  el.banner.style.transition='none'; el.banner.style.opacity= txt?'1':'0';
  if(txt) setTimeout(()=>{ el.banner.style.transition='opacity .8s'; el.banner.style.opacity='0'; },1400); }

// =============================================================================
// INPUT — satu jempol: tap + drag
// =============================================================================
let ptrDown=false, ptrX=0, ptrStartX=0, ptrT=0;
// Permukaan input adalah #stage, BUKAN kanvas 2D. Begitu renderer WebGL aktif,
// kanvas 2D berstatus display:none — jadi selama ini seluruh kendali sentuh
// mati persis pada mode render yang dipakai pemain sungguhan.
const surface = document.getElementById('stage') || cv;
function surfaceRect(){ return surface.getBoundingClientRect(); }

// Layar -> koordinat arena. Pemetaan linier disengaja: pemain menyamakan
// jempol dengan posisi squad, bukan dengan titik proyeksi 3D di lantai.
function screenToArenaX(clientX){
  const r = surfaceRect();
  const w = r.width || 1;
  const t = Math.max(0, Math.min(1, (clientX - r.left)/w));
  return -CFG.arena.width/2 + t*CFG.arena.width;
}
function queueSquad(clientX){ S.squadInput = screenToArenaX(clientX); }
function playable(){ return S.state === 'playing'; }

surface.addEventListener('pointerdown', e=>{
  if(!playable()) return;
  ptrDown=true; ptrX=ptrStartX=e.clientX; ptrT=performance.now();
  if(!S.bullets.some(b=>b.riding&&b.alive)) queueSquad(e.clientX);
  if(surface.setPointerCapture) surface.setPointerCapture(e.pointerId);
});
surface.addEventListener('pointermove', e=>{
  if(!ptrDown || !playable()) return;
  const dx = (e.clientX-ptrX)/(surfaceRect().width||1);
  const riding = S.bullets.find(b=>b.riding&&b.alive);
  if(riding){
    if(Math.abs(dx)>0.003) queueSteer(dx/0.18);   // riding: geser = belokkan peluru
  } else {
    queueSquad(e.clientX);                        // idle: geser = gerakkan squad
  }
  ptrX=e.clientX;
});
surface.addEventListener('pointerup', e=>{
  if(!ptrDown) return; ptrDown=false;
  if(!playable()) return;
  const dur=(performance.now()-ptrT)/1000;
  const moved=Math.abs(e.clientX-ptrStartX)/(surfaceRect().width||1);
  // Tap = tekan singkat yang tidak berpindah. Selain itu pemain sedang
  // menggerakkan squad, dan menembak di situ akan terasa seperti salah tembak.
  if(dur<0.25 && moved<0.015) fire();
});
surface.addEventListener('pointercancel', ()=>{ ptrDown=false; });

// Tombol aksi: jempol kanan tidak perlu menutupi arena untuk menembak, dan
// pemain baru punya target yang jelas untuk ditekan.
if(el.fireBtn) el.fireBtn.addEventListener('click', e=>{ e.stopPropagation(); if(playable()) fire(); });
if(el.pauseBtn) el.pauseBtn.addEventListener('click', e=>{ e.stopPropagation(); showPause(); });

window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(S.state==='playing') showPause(); else if(S.state==='paused') resumeRun(); return; }
  if(S.state==='paused'){ if(e.key.toLowerCase()==='p') resumeRun(); return; }
  if(S.state==='menu') return;
  if(e.key===' '){ e.preventDefault(); fire(); }
  if(e.key==='p'||e.key==='P'){ showPause(); return; }
  if(e.key==='ArrowLeft'){ queueSteer(-1); queueAim(-6); }
  if(e.key==='ArrowRight'){ queueSteer(1); queueAim(6); }
  if(e.key.toLowerCase()==='r') resetRun();
  if('12345'.includes(e.key)) loadVariant(+e.key-1);
});

// =============================================================================
// MAIN LOOP
// =============================================================================
let lastT = performance.now(), fpsAcc=0, fpsN=0, fpsShow=0;
let RENDER_ALPHA = 1;
function frame(now){
  const realDt = Math.min(0.25, (now-lastT)/1000); lastT=now;

  // FPS
  fpsAcc += realDt; fpsN++;
  if(fpsAcc>0.4){ fpsShow = Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }

  if(CFG){
    // --- SlowMoSystem ---
    if(S.holdSlow>0){ S.holdSlow-=realDt; if(S.holdSlow<=0) S.targetTimeScale=1; }
    const k = 1-Math.exp(-(3/CFG.slowMo.transitionDuration)*realDt);
    S.timeScale += (S.targetTimeScale-S.timeScale)*k;
    S.fov += (S.targetFov-S.fov)*k;
    el.vig.style.opacity = String((1-S.timeScale)*1.2);
    tickScoreView(realDt);        // kosmetik: tidak pernah masuk langkah sim

    // --- SimClock: fixed step ---
    if(S.state==='playing'){
      S.acc += realDt*S.timeScale;
      let steps=0;
      while(S.acc>=FIXED_DT && steps<MAX_STEPS){ S.acc-=FIXED_DT; simulate(FIXED_DT); steps++; }
      if(S.acc>FIXED_DT*MAX_STEPS) S.acc=0;
      RENDER_ALPHA = S.acc / FIXED_DT;      // sisa waktu = posisi di antara tick
    } else {
      RENDER_ALPHA = 1;                     // diam: tampilkan pose terakhir utuh
    }
    updateAudioState(realDt);

    S.shake = Math.max(0, S.shake - realDt*3.2);
    draw();

    // HUD dinamis
    const rb = S.bullets.find(b=>b.riding&&b.alive);
    el.steerRow.classList.toggle('on', !!rb);
    const sv = rb? rb.steer/rb.steerMax : 0;
    el.steerFill.style.width = (sv*100).toFixed(1)+'%';
    el.steerSec.textContent = (rb?rb.steer:0).toFixed(1)+'s';

    // Tombol chain shot: cincin isi = progres charge, denyut = siap dipakai.
    // Ini satu-satunya sumber daya ofensif yang pemain kendalikan, jadi ia
    // dapat tombol fisik sendiri alih-alih sekadar deretan titik kecil.
    const maxCh = CFG.squad.chainShot.maxCharges;
    const ready = S.chainCharges > 0;
    const ring = ready ? 1 : Math.max(0, Math.min(1, S.chainCharge));
    el.fireBtn.style.setProperty('--p', ring.toFixed(3));
    el.fireBtn.classList.toggle('ready', ready);
    if(chargeShown !== S.chainCharges){ chargeShown = S.chainCharges; setAmmo(); }
    if(maxCh !== pipCount){ pipCount = maxCh; setAmmo(); }

    // Diagnostik hanya hidup kalau tab SETUP sedang terbuka. Angka debug tidak
    // punya tempat di layar permainan — itu yang membuat build sebelumnya
    // terbaca seperti alat, bukan game.
    if(dev('sFps')){
      dev('sFps').textContent = fpsShow;
      dev('sTick').textContent = S.tick;
      dev('sEnemies').textContent = S.enemies.length;
      dev('sBounce').textContent = rb?rb.bounceCount:(S.bullets[0]?S.bullets[0].bounceCount:0);
      dev('sDmg').textContent = (rb?rb.dmgMul:1).toFixed(2);
      dev('sSpd').textContent = (rb?rb.spdMul:1).toFixed(2);
      dev('sTs').textContent = S.timeScale.toFixed(2);
      dev('sKills').textContent = S.kills;
    }
  }
  requestAnimationFrame(frame);
}

let chargeShown = -1, pipCount = -1;
// Node diagnostik dibangun ulang tiap kali layar meta dirender, jadi referensi
// dicari ulang begitu yang lama lepas dari dokumen.
const devCache = {};
function dev(id){
  const hit = devCache[id];
  if(hit && hit.isConnected) return hit;
  const node = document.getElementById(id);
  devCache[id] = node && node.isConnected ? node : null;
  return devCache[id];
}

/**
 * Brings up the WebGL renderer. Returns false when Three.js is missing or the
 * context cannot be created (old device, blocked GPU, headless test), and the
 * 2D canvas takes over instead of the page breaking.
 */
let R3D_ON = false;
function startRenderer3D(){
  try{
    const gl = document.getElementById('webgl-canvas');
    if(!gl || typeof THREE === 'undefined' || !window.R3D) return false;
    if(!R3D.init(gl)) return false;
    gl.classList.add('on');
    cv.classList.add('hidden');
    return true;
  }catch(err){
    console.warn('WebGL tidak tersedia, memakai kanvas 2D:', err);
    return false;
  }
}

// =============================================================================
// BOOT
// =============================================================================
fetch('Config/arena_config.json')
  .then(r=>r.json())
  .then(cfg=>{
    CFG = cfg;
    R3D_ON = startRenderer3D();
    resize();
    UI_READY = true;
    metaLoad();
    S.stage = Math.min(META.unlocked, stageCount()-1);
    loadVariant(variantForStage(S.stage));
    showMap();
    setScore(); setAmmo(); setHp(); setWaveLabel();
    requestAnimationFrame(frame);
  })
  .catch(err=>{
    document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#f66">'+
      'Gagal memuat Config/arena_config.json<br>'+err+'</div>';
  });
</script>
</body>
