<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHAIN RIDER</title>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/GLTFLoader.js"></script>
<script src="js/render3d.js"></script>
<style>
  /* ===========================================================================
     CHAIN RIDER — skin UI mobile-first.

     SATU kerangka acuan: 1080 x 1920 (9:16), persis seperti project Godot.
     Semua angka di file ini adalah piksel acuan pada kerangka itu; #frame
     diskalakan utuh lewat transform:scale() di fitFrame(). Konsekuensinya:
       · rasio layar TIDAK PERNAH berubah — di ponsel 20:9 maupun desktop
         ultrawide yang terlihat tetap 9:16, sisanya jadi backdrop;
       · tata letak tidak perlu media query sama sekali;
       · satu angka di sini = satu piksel di mockup = satu piksel di Godot.

     Bahasa visualnya mengikuti game squad-runner mobile (Last War, Top War,
     Survivor.io): tombol tebal bertumpuk (bevel + shadow bawah), chip
     melengkung, angka besar, aksi utama di zona jempol bawah, dan TIDAK ADA
     panel data gaya aplikasi di layar permainan.
     ========================================================================= */
  :root {
    /* --accent* ditulis ulang per arena oleh applyTheme(); seluruh UI membacanya
       supaya antarmuka selalu sewarna dengan arena di belakangnya. */
    --accent:#00E5FF; --accentRGB:0,229,255; --accentLit:#7CFFEA;
    --enemy:#FF4D3D; --enemyRGB:255,77,61;
    --magenta:#B14DFF; --gold:#FFD54F; --danger:#FF1744;
    --bg0:#05070F; --bgTop:#0A1030; --panel:#0B1120; --track:#12233A;
    --ink:#F5F9FF; --inkDim:#93A6C4;
    --go:#5BE34B; --goDark:#1E7A2B; --goLit:#B6FF8A;
    --display:"Arial Black","Archivo Black","Segoe UI Black",
      system-ui,-apple-system,"Helvetica Neue",sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#02030A;
    font-family:var(--body); color:var(--ink);
    overscroll-behavior:none; user-select:none; -webkit-user-select:none; }

  /* ---------- Shell: backdrop + bingkai 9:16 ---------- */
  #app { position:fixed; inset:0; overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(var(--accentRGB),.16), transparent 60%),
      radial-gradient(100% 60% at 50% 110%, rgba(var(--enemyRGB),.10), transparent 60%),
      linear-gradient(180deg,#070C1C 0%, #04060F 55%, #02030A 100%);
  }
  /* Garis diagonal tipis di backdrop: memberi tekstur tanpa menarik perhatian
     dari layar permainan. Tidak pernah terlihat di ponsel (frame menutup penuh). */
  #app::after { content:""; position:absolute; inset:-20%; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 26px); }

  /* Diposisikan absolut, bukan sebagai item grid: kotak layout 1080x1920 jauh
     lebih besar dari viewport ponsel, dan item grid yang meluap dipaksa
     rata-awal oleh browser sehingga bingkai melompat keluar layar. */
  #frame { position:absolute; left:50%; top:50%; width:1080px; height:1920px;
    transform-origin:50% 50%; transform:translate(-50%,-50%) scale(var(--k,1));
    border-radius:52px; overflow:hidden; isolation:isolate;
    background:var(--bg0);
    box-shadow:
      0 0 0 3px rgba(var(--accentRGB),.22),
      0 0 0 10px rgba(4,8,18,.9),
      0 60px 160px rgba(0,0,0,.8),
      0 0 180px rgba(var(--accentRGB),.14);
    transition:box-shadow .35s ease; }
  /* Di ponsel bingkai mengisi layar: sudut membulat dan bayangan hanya bikin
     tepi kotor, jadi dimatikan lewat kelas yang dipasang fitFrame(). */
  #frame.full { border-radius:0; box-shadow:none; }

  #stage { position:absolute; inset:0; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #webgl-canvas { display:none; }
  #webgl-canvas.on { display:block; }
  #c.hidden { display:none; }

  /* =========================================================================
     HUD — hanya empat hal yang boleh dibaca saat bermain:
     skor, progres wave, jumlah pasukan, dan kesiapan chain shot.
     ========================================================================= */
  .hud { position:absolute; inset:0; pointer-events:none; font-variant-numeric:tabular-nums; }
  /* Chip HUD tidak boleh menembus layar menu: itu yang bikin layar home tadi
     terlihat seperti dua antarmuka yang ditumpuk. */
  .hud.off { display:none; }
  .hud button { pointer-events:auto; }

  /* 88px teratas tidak pernah dipakai: itu wilayah notch / punch-hole. */
  .topBar { position:absolute; top:88px; left:40px; right:40px; height:150px;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:18px; }

  .scorePod { justify-self:start; display:flex; flex-direction:column; gap:4px;
    padding:14px 28px 16px; border-radius:30px; min-width:250px;
    background:linear-gradient(180deg, rgba(8,16,36,.86), rgba(4,8,20,.86));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.10), inset 0 0 0 2px rgba(var(--accentRGB),.28),
      0 10px 24px rgba(0,0,0,.5); }
  .scorePod span { font:800 20px/1 var(--body); letter-spacing:5px; color:var(--inkDim); }
  .scorePod b { font:900 62px/1 var(--display); letter-spacing:-1px; color:var(--ink);
    text-shadow:0 5px 0 rgba(0,0,0,.45); }

  .stageChip { justify-self:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .stageChip .chipRow { display:flex; align-items:center; gap:12px;
    padding:12px 26px; border-radius:999px;
    background:rgba(var(--accentRGB),.12);
    box-shadow:inset 0 0 0 3px rgba(var(--accentRGB),.5), 0 8px 20px rgba(0,0,0,.45); }
  .stageChip .st { font:900 30px/1 var(--display); color:var(--accentLit); letter-spacing:1px; }
  .stageChip .wv { font:800 26px/1 var(--body); color:var(--ink); letter-spacing:2px; }
  .waveDots { display:flex; gap:9px; }
  .waveDots i { width:52px; height:11px; border-radius:999px; background:rgba(255,255,255,.14);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); transition:background .2s, box-shadow .2s; }
  .waveDots i.on { background:linear-gradient(90deg,var(--accent),var(--accentLit));
    box-shadow:0 0 16px rgba(var(--accentRGB),.8); }

  /* Tombol bundar: satu bahasa untuk pause, tutup, dan ikon lain. */
  .iconBtn { justify-self:end; width:112px; height:112px; border:0; border-radius:34px; cursor:pointer;
    font:900 40px/1 var(--display); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(20,34,66,.95), rgba(8,14,32,.95));
    box-shadow:inset 0 3px 0 rgba(255,255,255,.14), inset 0 0 0 3px rgba(var(--accentRGB),.35),
      0 8px 0 rgba(2,6,16,.9), 0 14px 26px rgba(0,0,0,.5);
    transition:transform .08s ease, box-shadow .08s ease; }
  .iconBtn:active { transform:translateY(6px);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.1), inset 0 0 0 3px rgba(var(--accentRGB),.5),
      0 2px 0 rgba(2,6,16,.9), 0 6px 14px rgba(0,0,0,.5); }

  .combo { position:absolute; top:430px; left:0; right:0; text-align:center;
    font:900 86px/1 var(--display); color:var(--gold); opacity:0; transform:scale(.8);
    text-shadow:0 0 36px rgba(255,213,79,.6), 0 7px 0 rgba(0,0,0,.45);
    transition:transform .12s ease-out, opacity .25s ease; }
  .combo.on { opacity:1; transform:scale(1); }

  /* ---------- Boss ---------- */
  .bossBar { position:absolute; top:268px; left:120px; right:120px; opacity:0;
    transition:opacity .3s; }
  .bossBar.on { opacity:1; }
  .bossName { font:900 26px/1 var(--display); letter-spacing:5px; color:#FF8A8A;
    margin-bottom:10px; text-align:center; text-shadow:0 4px 0 rgba(0,0,0,.5); }
  .bossTrack { height:28px; border-radius:999px; background:#2A1020; overflow:hidden;
    box-shadow:inset 0 0 0 3px rgba(255,80,80,.45), inset 0 4px 10px rgba(0,0,0,.6); }
  .bossFill { height:100%; width:100%; border-radius:999px;
    background:linear-gradient(180deg,#FF6A5A,#FF1744 60%,#C1102F);
    box-shadow:0 0 22px rgba(255,60,60,.7), inset 0 3px 0 rgba(255,255,255,.35);
    transition:width .12s linear; }

  /* ---------- Pasukan: angka terpenting dalam loop ini ---------- */
  .troopPod { position:absolute; left:40px; bottom:430px;
    display:flex; align-items:center; gap:14px; padding:12px 26px 14px 18px; border-radius:28px;
    background:linear-gradient(180deg, rgba(8,18,40,.9), rgba(4,8,20,.9));
    box-shadow:inset 0 0 0 3px rgba(var(--accentRGB),.4), 0 10px 24px rgba(0,0,0,.5);
    transition:box-shadow .2s, transform .12s; }
  .troopPod .glyph { width:56px; height:56px; border-radius:18px; display:grid; place-items:center;
    background:rgba(var(--accentRGB),.18); font:900 30px/1 var(--display); color:var(--accentLit); }
  .troopPod .num { font:900 58px/1 var(--display); color:var(--ink); text-shadow:0 5px 0 rgba(0,0,0,.45); }
  .troopPod .cap { font:800 18px/1 var(--body); letter-spacing:4px; color:var(--inkDim); }
  .troopPod.low { box-shadow:inset 0 0 0 3px rgba(255,23,68,.65), 0 0 36px rgba(255,23,68,.35); }
  .troopPod.low .num { color:#FF6B7F; }
  .troopPod.bump { transform:scale(1.08); }

  /* ---------- Dek kendali bawah (zona jempol) ---------- */
  .deck { position:absolute; left:0; right:0; bottom:0; height:400px; padding:0 40px 72px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:28px;
    background:linear-gradient(180deg, transparent, rgba(3,6,16,.55) 45%, rgba(3,6,16,.86)); }
  .deckLeft { flex:1; display:flex; flex-direction:column; gap:18px; padding-bottom:12px; }

  .hp { display:flex; gap:12px; }
  .hp i { width:62px; height:62px; border-radius:20px; display:block;
    background:linear-gradient(180deg,#FF5C7A,#D11034);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.4), 0 6px 0 rgba(90,8,24,.9), 0 10px 18px rgba(0,0,0,.45);
    position:relative; transition:filter .2s, opacity .2s, transform .12s; }
  .hp i::after { content:"♥"; position:absolute; inset:0; display:grid; place-items:center;
    font-size:34px; color:rgba(255,255,255,.92); text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .hp i.e { background:linear-gradient(180deg,#223049,#121B2C); box-shadow:inset 0 0 0 2px rgba(255,255,255,.07);
    opacity:.55; }
  .hp i.e::after { color:rgba(255,255,255,.18); }

  .steerRow { display:flex; align-items:center; gap:16px; opacity:0; transform:translateY(10px);
    transition:opacity .15s, transform .15s; }
  .steerRow.on { opacity:1; transform:none; }
  .steerLbl { font:900 22px/1 var(--display); letter-spacing:4px; color:var(--accentLit); }
  .steerTrack { flex:1; height:26px; border-radius:999px; background:rgba(4,10,24,.9);
    box-shadow:inset 0 0 0 3px rgba(var(--accentRGB),.3), inset 0 4px 10px rgba(0,0,0,.6); overflow:hidden; }
  .steerFill { height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accentLit));
    box-shadow:0 0 20px rgba(var(--accentRGB),.8), inset 0 3px 0 rgba(255,255,255,.4); }
  .steerSec { font:900 28px/1 var(--display); color:var(--accentLit); min-width:92px; text-align:right; }

  /* Tombol aksi utama: bundar, besar, di pojok kanan bawah — satu jempol. */
  .fireBtn { position:relative; width:230px; height:230px; border:0; border-radius:50%; cursor:pointer;
    display:grid; place-items:center; gap:0; padding:0; color:#04121B;
    background:
      conic-gradient(from -90deg, var(--accentLit) calc(var(--p,0) * 1turn), rgba(255,255,255,.10) 0);
    box-shadow:0 14px 0 rgba(2,8,18,.85), 0 22px 40px rgba(0,0,0,.6);
    transition:transform .08s ease, box-shadow .08s ease, filter .2s; }
  .fireBtn::before { content:""; position:absolute; inset:16px; border-radius:50%;
    background:linear-gradient(180deg, rgba(14,28,56,.98), rgba(6,12,28,.98));
    box-shadow:inset 0 4px 0 rgba(255,255,255,.1); }
  .fireBtn .lbl { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .fireBtn .ico { font:900 64px/1 var(--display); color:#2B3A55; text-shadow:none; transition:color .2s; }
  .fireBtn .cap { font:900 22px/1 var(--display); letter-spacing:4px; color:#48597A; transition:color .2s; }
  .fireBtn .pips { position:relative; display:flex; gap:8px; margin-top:4px; }
  .fireBtn .pips span { width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.14);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.1); }
  .fireBtn .pips span.on { background:var(--accentLit); box-shadow:0 0 14px rgba(var(--accentRGB),.9); }
  .fireBtn.ready { animation:firePulse 1.4s ease-in-out infinite; }
  .fireBtn.ready .ico { color:var(--accentLit); text-shadow:0 0 28px rgba(var(--accentRGB),.8); }
  .fireBtn.ready .cap { color:var(--accentLit); }
  .fireBtn:active { transform:translateY(10px); box-shadow:0 4px 0 rgba(2,8,18,.85), 0 10px 20px rgba(0,0,0,.6); }
  @keyframes firePulse {
    0%,100% { box-shadow:0 14px 0 rgba(2,8,18,.85), 0 22px 40px rgba(0,0,0,.6), 0 0 0 0 rgba(var(--accentRGB),.5); }
    50%     { box-shadow:0 14px 0 rgba(2,8,18,.85), 0 22px 40px rgba(0,0,0,.6), 0 0 0 26px rgba(var(--accentRGB),0); }
  }

  /* Petunjuk kontrol: toast yang hilang sendiri, bukan paragraf permanen. */
  /* Toast petunjuk duduk di tengah lapangan: ruang itu kosong selama detik
     pertama (musuh masih di ujung jauh, squad di bawah), jadi tidak ada yang
     tertutup saat pemain paling butuh melihat keduanya. */
  .toast { position:absolute; left:100px; right:100px; top:46%; transform:translateY(-50%); text-align:center;
    padding:20px 28px; border-radius:26px; opacity:0; transition:opacity .45s ease;
    font:700 28px/1.45 var(--body); color:#DCE8FA; letter-spacing:.3px;
    background:rgba(4,10,24,.82); box-shadow:inset 0 0 0 2px rgba(var(--accentRGB),.25); }
  .toast b { color:var(--accentLit); font-weight:900; }

  .popupWrap { position:absolute; inset:0; display:grid; place-items:center; }
  .popup { font:900 120px/1 var(--display); color:var(--gold); opacity:0;
    text-shadow:0 0 50px rgba(255,213,79,.75), 0 8px 0 rgba(0,0,0,.45); }
  .banner { position:absolute; left:0; right:0; top:44%; text-align:center;
    font:900 110px/1 var(--display); letter-spacing:2px; opacity:0;
    text-shadow:0 10px 0 rgba(0,0,0,.5), 0 0 60px rgba(0,0,0,.6); }
  #flash { position:absolute; inset:0; background:var(--danger); opacity:0; }
  #vig { position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(0,52,77,.85) 100%);
    transition:opacity .2s; }

  /* =========================================================================
     LAYAR META — home, draft kartu, hasil, pause.
     Semua di dalam bingkai yang sama, jadi tidak pernah ada "halaman web"
     di sebelah permainan.
     ========================================================================= */
  #meta { position:absolute; inset:0; display:none; flex-direction:column; z-index:40;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(var(--accentRGB),.16), transparent 62%),
      linear-gradient(180deg, rgba(3,7,18,.92), rgba(2,4,12,.97)); }
  #meta.on { display:flex; }

  .screen { flex:1; display:flex; flex-direction:column; min-height:0; padding:88px 48px 64px; }

  /* --- bar profil + sumber daya --- */
  .homeTop { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .profile { display:flex; align-items:center; gap:18px; padding:10px 28px 10px 10px; border-radius:999px;
    background:rgba(8,16,36,.85); box-shadow:inset 0 0 0 3px rgba(var(--accentRGB),.3); }
  .avatar { width:96px; height:96px; border-radius:30px; display:grid; place-items:center;
    font:900 40px/1 var(--display); color:#04121B;
    background:linear-gradient(180deg,var(--accentLit),var(--accent));
    box-shadow:inset 0 4px 0 rgba(255,255,255,.5), 0 6px 0 rgba(0,40,60,.7); }
  .profile .who { display:flex; flex-direction:column; gap:6px; }
  .profile .who b { font:900 30px/1 var(--display); letter-spacing:1px; }
  .profile .who span { font:800 22px/1 var(--body); letter-spacing:3px; color:var(--inkDim); }
  .resPills { display:flex; gap:14px; }
  .pill { display:flex; align-items:center; gap:10px; padding:16px 26px; border-radius:999px;
    font:900 30px/1 var(--display); color:var(--ink);
    background:rgba(8,16,36,.85); box-shadow:inset 0 0 0 3px rgba(255,255,255,.08); }
  .pill i { font-style:normal; font-size:30px; }
  .pill.gold { color:var(--gold); box-shadow:inset 0 0 0 3px rgba(255,213,79,.35); }

  /* --- logo --- */
  .logo { margin:40px 0 26px; text-align:center; font:900 112px/0.94 var(--display);
    letter-spacing:-2px; color:var(--ink); text-shadow:0 10px 0 rgba(0,0,0,.45); }
  .logo span { display:block; font-size:112px; color:var(--accent);
    text-shadow:0 10px 0 rgba(0,0,0,.45), 0 0 60px rgba(var(--accentRGB),.5); }
  .logo em { display:block; margin-top:14px; font:800 24px/1 var(--body); font-style:normal;
    letter-spacing:9px; color:var(--inkDim); }

  /* --- tab bawah ala game, bukan menu aplikasi --- */
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px; }
  .tab { border:0; cursor:pointer; padding:22px 10px 20px; border-radius:26px; font-family:var(--display);
    font-size:28px; font-weight:900; letter-spacing:3px; color:var(--inkDim);
    background:rgba(8,16,36,.8); box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);
    transition:color .15s, box-shadow .15s, transform .1s; }
  .tab.sel { color:#04121B; background:linear-gradient(180deg,var(--accentLit),var(--accent));
    box-shadow:inset 0 4px 0 rgba(255,255,255,.45), 0 8px 0 rgba(0,45,65,.75); }
  .tab:active { transform:translateY(4px); }

  .pane { flex:1; min-height:0; display:none; flex-direction:column; gap:26px;
    justify-content:space-evenly; }
  .pane[data-pane="squad"], .pane[data-pane="setup"] { justify-content:flex-start; }
  .pane.sel { display:flex; }

  /* --- kartu chapter: fokus layar home --- */
  .chapter { position:relative; border-radius:40px; overflow:hidden; padding:36px 40px;
    background:linear-gradient(170deg, var(--cardTop,#0A1030), var(--cardBot,#03060F));
    box-shadow:inset 0 0 0 3px rgba(var(--accentRGB),.4), 0 20px 50px rgba(0,0,0,.6); }
  .chapter::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(90deg, rgba(var(--accentRGB),.09) 0 2px, transparent 2px 72px),
      radial-gradient(90% 70% at 50% 115%, rgba(var(--accentRGB),.28), transparent 70%); }
  /* Pratinjau lorong: trapesium ber-grid dengan warna tema varian. Dibuat dari
     CSS, bukan gambar, supaya 5 arena otomatis punya seni sendiri. */
  .chapter .preview { position:relative; height:230px; margin:-16px -20px 20px; overflow:hidden;
    border-radius:26px; background:linear-gradient(180deg, var(--cardBot,#03060F), var(--cardTop,#0A1030)); }
  .chapter .lane { position:absolute; left:50%; bottom:-10px; width:560px; height:250px;
    transform:translateX(-50%); clip-path:polygon(28% 0, 72% 0, 100% 100%, 0% 100%);
    background:
      repeating-linear-gradient(0deg, rgba(var(--accentRGB),.22) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, rgba(var(--accentRGB),.10), rgba(var(--accentRGB),.30));
    box-shadow:inset 0 0 60px rgba(0,0,0,.6); }
  .chapter .crowd { position:absolute; top:34px; left:50%; transform:translateX(-50%);
    display:flex; gap:7px; }
  .chapter .crowd i { width:9px; height:18px; border-radius:3px; background:var(--enemy);
    box-shadow:0 0 10px rgba(var(--enemyRGB),.7); }
  .chapter .me { position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; gap:9px; }
  .chapter .me i { width:13px; height:26px; border-radius:4px; background:var(--accentLit);
    box-shadow:0 0 14px rgba(var(--accentRGB),.9); }
  .chapter .kicker { position:relative; font:800 24px/1 var(--body); letter-spacing:8px; color:var(--accentLit); }
  .chapter h3 { position:relative; margin:14px 0 0; font:900 68px/1 var(--display); letter-spacing:-1px; }
  .chapter .meta { position:relative; margin-top:18px; display:flex; flex-wrap:wrap; gap:12px; }
  .chapter .tagx { padding:12px 22px; border-radius:999px; font:900 24px/1 var(--display); letter-spacing:2px;
    color:var(--ink); background:rgba(0,0,0,.35); box-shadow:inset 0 0 0 2px rgba(255,255,255,.12); }
  .chapter .tagx.boss { color:#FFB3B3; box-shadow:inset 0 0 0 2px rgba(255,90,90,.4); }
  .chapter .desc { position:relative; margin:18px 0 0; font:600 26px/1.5 var(--body); color:#C3D3EA; }
  .stars { position:relative; margin-top:18px; display:flex; gap:8px; font-size:34px; color:var(--gold); }
  .stars span.off { color:rgba(255,255,255,.16); }

  /* --- rel stage horizontal (chapter select), bukan daftar panjang --- */
  .railHead { display:flex; align-items:baseline; justify-content:space-between; }
  .railHead b { font:900 30px/1 var(--display); letter-spacing:3px; }

<!-- Shell: backdrop + satu bingkai 9:16. Tidak ada apa pun di luar bingkai yang

  <div id="frame">

          <b>GESER</b> untuk menggerakkan squad — posisinya adalah bidikanmu.<br>
          <b>TAP</b> untuk chain shot, lalu <b>GESER</b> membelokkan peluru.
        </div>

        <div class="deck">
          <div class="deckLeft">
            <div class="steerRow" id="steerRow">
              <span class="steerLbl">STEER</span>

<script>
// =============================================================================
// CHAIN RIDER — Prototipe arena 2.5D
//
// Port ringkas dari skeleton C#:
//   SimClock          -> fixed-step accumulator 1/60
//   DeterministicRng  -> xorshift128
//   RicochetSolver    -> reflect + swept-circle (TANPA physics engine)
//   BulletController  -> ricochet, steer, bullet riding, slow-mo intent
//   CrowdManager      -> formasi, sway, separation, damage
//   SlowMoSystem      -> timeScale tunggal
//   CameraRig         -> proyeksi 2.5D + shake + zoom
// =============================================================================

// ---------- DeterministicRng (xorshift128) ----------
function Rng(seed){
  let s = seed >>> 0;
  const mix = () => { s = (s + 0x9E3779B9) >>> 0; let z = s;
    z = Math.imul(z ^ (z>>>16), 0x85EBCA6B) >>> 0;
    z = Math.imul(z ^ (z>>>13), 0xC2B2AE35) >>> 0;
    return (z ^ (z>>>16)) >>> 0; };
  let x = mix(), y = mix(), z2 = mix(), w = mix();
  if ((x|y|z2|w) === 0) x = 0x9E3779B9;
  const next = () => { const t = (x ^ (x<<11)) >>> 0; x=y; y=z2; z2=w;
    w = (w ^ (w>>>19) ^ t ^ (t>>>8)) >>> 0; return w; };
  return {
    next,
    f: () => (next() >>> 8) * (1/16777216),
    range(a,b){ return a + (b-a)*this.f(); },
    int(a,b){ return a + (next() % (b-a)); },
    weighted(w){ let t=0; for(const v of w) t+=v; let r=this.f()*t;
      for(let i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return i; } return w.length-1; }
  };
}

// ---------- Konstanta simulasi ----------
const FIXED_DT = 1/60, MAX_STEPS = 5;
let CFG = null;               // diisi dari Config/arena_config.json

// ---------- State global ----------
const S = {
  variant:0, rng:null, tick:0, acc:0,
  state:'playing',            // playing | victory | defeat
  stage:0, diff:1, upg:{},    // meta: ladder position, difficulty, active card stats
  score:0, combo:0, bestCombo:0, kills:0, lives:3, coins:0,
  waveIndex:-1, waveTimer:1.5, waveActive:false, leaked:0,
  ammo:5, reload:0,
  timeScale:1, targetTimeScale:1, holdSlow:0, enemySeq:0,
  shake:0, shakeAmp:0, fov:1, targetFov:1,
  enemies:[], bullets:[], obstacles:[], fx:[], floats:[],
  bounceLadder:0, lastBounce:0,
  invul:0,
  aimAngle:0, aimDir:1, aimInput:0,   // dipertahankan untuk mode sweep/aksesibilitas
  // --- Last War ATM: squad bergerak, auto-fire, gate matematika ---
  squadX:0, squadTargetX:0, squadInput:null,  // squadInput di-queue, dikonsumsi di dalam tick
  troops:5, autoBullets:[], autoCd:0,
  gates:[], gateNextAt:0,
  chainCharge:0, chainCharges:0,
  boss:null,
};

// ---------- Audio (WebAudio, pitch-ladder bounce) ----------
let AC=null, master=null, hpFilter=null, lpFilter=null;
const BASE_GAIN = 0.22;
// docs/07 7.3: HP=1 memakai high-pass sweep, slow-mo memakai low-pass 1200 Hz
// dan -6 dB. Dua filter dipasang permanen lalu dibiarkan transparan saat tidak
// dipakai, supaya tidak ada penyambungan ulang graph di tengah permainan.
function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain();
  // Stub audio di lingkungan uji tidak punya AudioParam; itu bukan alasan
  // untuk menghentikan boot.
  if(master && master.gain) master.gain.value = BASE_GAIN * masterVolume();
  // Browser yang sangat tua bisa saja tidak punya BiquadFilter. Kalau begitu,
  // suara tetap keluar tanpa filter alih-alih mematikan audio sama sekali.
  const mk = () => (typeof AC.createBiquadFilter === 'function') ? AC.createBiquadFilter() : null;
  const hp = mk(), lp = mk();
  if(hp && lp && hp.frequency && lp.frequency){
    hp.type='highpass'; hp.frequency.value=10;
    lp.type='lowpass';  lp.frequency.value=20000;
    master.connect(hp); hp.connect(lp); lp.connect(AC.destination);
    hpFilter=hp; lpFilter=lp;
  } else {
    master.connect(AC.destination);
  }
}
/** Ramp yang aman: sebagian lingkungan uji tidak punya penjadwal AudioParam. */
function ramp(param, value, atTime){
  if(!param) return;
  if(typeof param.linearRampToValueAtTime === 'function') param.linearRampToValueAtTime(value, atTime);
  else param.value = value;
}
function masterVolume(){ return META.volume === undefined ? 1 : META.volume; }
// Dijaga terhadap graf audio yang distub (jsdom, uji headless): mengubah
// volume tidak boleh melempar hanya karena tidak ada perangkat suara.
function applyVolume(){ if(master && master.gain) master.gain.value = BASE_GAIN * masterVolume(); }

/** Sub pulse per beat saat nyawa tinggal 1 (120 BPM -> tiap 0,5 detik). */
function subPulse(){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(55, AC.currentTime);
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.5, AC.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+0.26);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+0.3);
}

/**
 * Menyetel filter mengikuti kondisi permainan. Dipanggil dari loop render, jadi
 * murni kosmetik: tidak satu pun nilainya masuk kembali ke simulasi.
 */
let _beatTimer = 0;
function updateAudioState(realDt){
  if(!AC) return;
  const t = AC.currentTime;
  const lowLife = S.state==='playing' && S.lives === 1;
  // High-pass naik saat nyawa kritis, turun lagi begitu aman.
  if(hpFilter) ramp(hpFilter.frequency, lowLife ? 340 : 10, t + 0.35);
  // Slow-mo meredam suara: low-pass 1200 Hz dan -6 dB.
  const slow = S.timeScale < 0.92;
  if(lpFilter) ramp(lpFilter.frequency, slow ? 1200 : 20000, t + 0.2);
  ramp(master.gain, BASE_GAIN * masterVolume() * (slow ? 0.5 : 1), t + 0.2);

  if(lowLife){
    _beatTimer -= realDt;
    if(_beatTimer <= 0){ subPulse(); _beatTimer = 0.5; }   // 120 BPM
  } else _beatTimer = 0;
}
function beep(freq, dur, type='sine', vol=1, slide=0){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide), AC.currentTime+dur);
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(vol, AC.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+0.02);
}
const SFX = {
  shot(){ beep(180,0.13,'square',0.5,0.4); beep(70,0.18,'sine',0.7,0.6); },
  // Pitch ladder: naik 1 semitone tiap bounce (persis AudioDirector.cs)
  bounce(n){ beep(660*Math.pow(1.05946, Math.min(n,14)), 0.09,'triangle',0.45); },
  kill(){ beep(280+Math.random()*80,0.05,'square',0.16); },   // kosmetik: pitch SFX
  combo(){ [0,4,7].forEach((st,i)=>setTimeout(()=>beep(523*Math.pow(1.05946,st),0.16,'sine',0.5),i*70)); },
  boom(){ beep(90,0.5,'sawtooth',0.6,0.25); beep(45,0.7,'sine',0.7,0.4); },
  slow(){ beep(420,0.3,'sine',0.35,0.45); },
  breach(){ beep(120,0.35,'sawtooth',0.6,0.7); },
  expire(){ beep(300,0.2,'triangle',0.25,0.4); },
};

// =============================================================================
// RICOCHET SOLVER — matematika murni, tanpa physics engine
// =============================================================================
const Solver = {
  reflect(dx,dz,nx,nz){ const d = 2*(dx*nx+dz*nz); return [dx-d*nx, dz-d*nz]; },

  // Pengaman sudut serempet: paksa minimal 12° menjauh dari permukaan.
  reflectSafe(dx,dz,nx,nz){
    let [rx,rz] = this.reflect(dx,dz,nx,nz);
    const sin = rx*nx+rz*nz, minSin = Math.sin(12*Math.PI/180);
    if(sin < minSin){ rx += nx*(minSin-sin)*1.5; rz += nz*(minSin-sin)*1.5; }
    const l = Math.hypot(rx,rz)||1; return [rx/l, rz/l];
  },

  rotate(dx,dz,deg){ const r=deg*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    return [dx*c+dz*s, -dx*s+dz*c]; },

  // Swept circle vs circle: akar terkecil dari a t^2 + b t + k = 0
  sweepCircle(px,pz,ddx,ddz,rb, cx,cz,rc){
    const mx=px-cx, mz=pz-cz, R=rb+rc;
    const a=ddx*ddx+ddz*ddz; if(a<1e-12) return null;
    const b=2*(mx*ddx+mz*ddz), k=mx*mx+mz*mz-R*R;
    if(k<0){ const l=Math.hypot(mx,mz)||1; return {t:0,nx:mx/l,nz:mz/l}; }
    const disc=b*b-4*a*k; if(disc<0) return null;
    const t=(-b-Math.sqrt(disc))/(2*a); if(t<0||t>1) return null;
    const hx=px+ddx*t, hz=pz+ddz*t, l=Math.hypot(hx-cx,hz-cz)||1;
    return {t, nx:(hx-cx)/l, nz:(hz-cz)/l};
  },

  // Dinding samping: bidang X = konstan
  sweepWalls(px,ddx,rb,xMin,xMax){
    let best=null;
    if(ddx<-1e-6){ const t=((xMin+rb)-px)/ddx; if(t>=0&&t<=1) best={t,nx:1,nz:0}; }
    if(ddx> 1e-6){ const t=((xMax-rb)-px)/ddx; if(t>=0&&t<=1&&(!best||t<best.t)) best={t,nx:-1,nz:0}; }
    return best;
  },

  // Gravity well: memutar ARAH, tidak menambah kecepatan.
  gravity(px,pz,dx,dz,cx,cz,r,force,dt){
    const tx=cx-px, tz=cz-pz, dist=Math.hypot(tx,tz);
    if(dist>r||dist<1e-4) return [dx,dz];
    const strength = 1 - dist/r;
    const want = Math.atan2(tz/dist, tx/dist), cur = Math.atan2(dz,dx);
    let diff = want-cur; while(diff>Math.PI) diff-=2*Math.PI; while(diff<-Math.PI) diff+=2*Math.PI;
    const maxStep = 120*Math.PI/180*dt;
    const step = Math.max(-maxStep, Math.min(maxStep, diff*strength*force*dt));
    const a = cur+step; return [Math.cos(a), Math.sin(a)];
  }
};

// =============================================================================
// FORMATION BUILDER
// =============================================================================
function buildFormation(kind, count, cols, spacing, halfW){
  const out=[];
  if(kind==='rect'){
    const hw=(cols-1)*spacing/2;
    for(let i=0;i<count;i++) out.push([ (i%cols)*spacing-hw, Math.floor(i/cols)*spacing ]);
  } else if(kind==='vshape'){
    let row=0; while(out.length<count){
      const x=Math.min(row*spacing*0.6, halfW), z=row*spacing*0.8;
      out.push([-x,z]); if(x>0.01&&out.length<count) out.push([x,z]); row++; if(row>400)break;
    }
  } else if(kind==='diamond'){
    const maxW=Math.floor(Math.sqrt(count)), total=maxW*2; let row=0;
    while(out.length<count&&row<total){
      const n=Math.max(1, row<=maxW?row+1:total-row+1), hw=Math.min((n-1)*spacing/2, halfW);
      for(let c=0;c<n&&out.length<count;c++)
        out.push([ n===1?0:(-hw+(2*hw)*c/(n-1)), row*spacing*0.9 ]);
      row++;
    }
    while(out.length<count){ const c=out.length%6; out.push([(c-2.5)*spacing, row*spacing*0.9]); if(c===5)row++; }
  } else if(kind==='circle'){
    let ring=1; while(out.length<count){
      const r=Math.min(ring*spacing*1.1, halfW);
      const per=Math.max(6, Math.floor(2*Math.PI*r/spacing));
      for(let i=0;i<per&&out.length<count;i++){ const a=i/per*Math.PI*2;
        out.push([Math.cos(a)*r, Math.sin(a)*r+r]); }
      ring++; if(ring>60)break;
    }
  } else { for(let i=0;i<count;i++) out.push([0, i*spacing*0.7]); }
  return out;
}

// Pushes the variant palette into CSS so the HUD, the side panel and the
// stage frame all repaint together with the arena.
function applyTheme(theme){
  const rgb = hex => {
    const h = theme[hex].replace('#','');
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  };
  const root = document.documentElement.style;
  root.setProperty('--accent', theme.primary);
  root.setProperty('--accentRGB', rgb('primary'));
  root.setProperty('--accentLit', mixHex(theme.primary, '#FFFFFF', 0.45));
  root.setProperty('--enemy', theme.enemy);
  root.setProperty('--enemyRGB', rgb('enemy'));
  root.setProperty('--bgTop', theme.bgTop);
  root.setProperty('--bg0', theme.bgBottom);
  root.setProperty('--track', mixHex(theme.bgTop, '#000000', 0.35));
}

// Linear blend between two hex colours; t=0 keeps a, t=1 keeps b.
function mixHex(a, b, t){
  const p = h => [0,2,4].map(i=>parseInt(h.replace('#','').slice(i,i+2),16));
  const [ar,ag,ab] = p(a), [br,bg,bb] = p(b);
  const m = (x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,'0');
  return '#'+m(ar,br)+m(ag,bg)+m(ab,bb);
}

// =============================================================================
// META — stage ladder + upgrade cards. Mirrors the Godot SaveGame autoload so
// the browser build shows the same campaign the engine build does.
// =============================================================================
// Only the browser boot path sets this. The headless harness (tools/sim_test.js)
// loads this same file with a stubbed DOM, so meta screens must stay out of its way.
let UI_READY = false;
const SAVE_KEY = 'chainrider.meta.v1';
const META = { unlocked:0, cards:[], best:0, volume:1 };

function metaLoad(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d = JSON.parse(raw);
    META.unlocked = d.unlocked|0;
    META.cards = Array.isArray(d.cards) ? d.cards : [];
    META.best = d.best|0;
    if(typeof d.volume === 'number') META.volume = Math.max(0, Math.min(1, d.volume));
  }catch(e){ /* a corrupt save starts fresh rather than refusing to boot */ }
}
function metaSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(META)); }catch(e){} }

function stageCount(){ return (CFG.meta && CFG.meta.stageCount) || 15; }
function variantForStage(s){
  const cyc = (CFG.meta && CFG.meta.variantCycle) || [0,1,2,3,4];
  return cyc[s % cyc.length]|0;
}
function difficultyForStage(s){
  return 1 + ((CFG.meta && CFG.meta.difficultyPerStage) || 0.12) * s;
}

// Folds owned cards into stat multipliers. Same rule as SaveGame.active_upgrades():
// "mul" stacks multiplicatively, "add" additively.
function activeUpgrades(){
  const out = {};
  const cards = (CFG.meta && CFG.meta.cards) || [];
  for(const id of META.cards){
    for(const c of cards){
      if(c.id !== id) continue;
      if(c.mul !== undefined) out[c.stat] = (out[c.stat] === undefined ? 1 : out[c.stat]) * c.mul;
      else if(c.add !== undefined) out[c.stat] = (out[c.stat] === undefined ? 0 : out[c.stat]) + c.add;
    }
  }
  return out;
}
function upMul(stat){ const v = S.upg[stat]; return v === undefined ? 1 : v; }
function upAdd(stat){ const v = S.upg[stat]; return v === undefined ? 0 : v; }

function loadVariant(idx){
  S.variant = idx;
  const v = CFG.variants[idx];
  applyTheme(v.theme);
  if(R3D_ON) R3D.setAccent(parseInt(v.theme.primary.replace('#',''), 16));
  S.obstacles = v.obstacles.map(o=>({
    kind:o.type, x:o.x, z:o.z, bx:o.x,
    r:o.radius ?? (CFG.obstacleDefaults[o.type]?.radius ?? 0.9),
    w:o.width ?? 4, travel:o.travel ?? 6, speed:o.speed ?? 2, phase:o.phase ?? 0,
    force:o.force ?? 5, hp:o.type==='barrel'?1:(o.type==='shieldWall'?3:Infinity), alive:true
  }));
  document.querySelectorAll('.vbtn').forEach((b,i)=>b.classList.toggle('sel', i===idx));
  resetRun();
}

function resetRun(){
  // Seeded from the stage, matching Godot: the same stage always plays the same way.
  S.upg = activeUpgrades();
  S.diff = difficultyForStage(S.stage);
  S.rng = Rng(CFG.determinism.defaultSeed + S.stage*7919);
  S.tick=0; S.acc=0; S.state='playing';
  S.score=0; S.combo=0; S.bestCombo=0; S.kills=0; S.lives=CFG.player.lives; S.coins=0;
  S.waveIndex=-1; S.waveTimer=1.2; S.waveActive=false; S.leaked=0;
  S.ammo=CFG.bullet.magazine; S.reload=0;
  S.timeScale=1; S.targetTimeScale=1; S.holdSlow=0; S.shake=0; S.fov=1; S.targetFov=1;
  S.enemies=[]; S.bullets=[]; S.fx=[]; S.floats=[]; S.bounceLadder=0; S.enemySeq=0;
  S.aimAngle=0; S.aimDir=1; S.aimInput=0; S.boss=null; S.invul=0;
  const SQ=CFG.squad;
  S.squadX=0; S.squadTargetX=0; S.squadInput=null;
  S.troops=SQ.startTroops + upAdd('startTroops'); S.autoBullets=[]; S.autoCd=0;
  S.gates=[]; S.gateNextAt=CFG.gates.firstAtSeconds;
  S.chainCharge=0; S.chainCharges=0;
  for(const o of S.obstacles){ o.alive=true; o.hp = o.kind==='barrel'?1:(o.kind==='shieldWall'?3:Infinity); }
  banner('', 0);
  showHint();
}

// =============================================================================
// ENEMY
// =============================================================================
const TYPES = ['grunt','runner','brute','shielder','splitter','bomber'];
function typeStats(t){
  const e = CFG.enemyTypes.find(x=>x.id===t) || CFG.enemyTypes[0];
  return { hp:e.hp*S.diff, speed:e.speed*S.diff, color:e.color,
    score:e.score, r: t==='brute'?0.55:(t==='shielder'?0.5:0.38),
    armored: t==='brute'||t==='shielder',
    explode: t==='bomber', split: t==='splitter' };
}

function spawnWave(){
  const w = Math.min(S.waveIndex, CFG.spawn.enemiesPerWave.length-1);
  let count = CFG.spawn.enemiesPerWave[w];
  const kind = CFG.spawn.formation[w];
  count = Math.min(count, CFG.spawn.maxActiveEnemies - S.enemies.length);
  if(count<=0) return;

  const cols = S.rng.int(CFG.spawn.columnsRange[0], CFG.spawn.columnsRange[1]+1);
  const halfW = CFG.arena.width/2 - 1.2;
  const pts = buildFormation(kind, count, cols, CFG.spawn.spacing, halfW);
  const baseZ = CFG.arena.height + 1;

  pts.forEach((p,i)=>{
    // Baris depan selalu grunt → pemain punya target empuk untuk memicu riding.
    let t = 'grunt';
    if(i>=6){
      const ws = [[1,0,0,0,0,0],[.7,.3,0,0,0,0],[.5,.2,.1,.1,.1,0],
                  [.4,.2,.12,.12,.08,.08],[.35,.2,.15,.1,.1,.1]][Math.min(w,4)];
      t = TYPES[S.rng.weighted(ws)];
    }
    const st = typeStats(t);
    S.enemies.push({
      // Identitas kosmetik: renderer memakainya untuk tahu unit mana yang
      // lenyap antar frame, lalu memainkan animasi roboh di tempatnya.
      // Deterministik (penghitung, bukan RNG), jadi replay tidak terpengaruh.
      id: ++S.enemySeq,
      type:t, x:Math.max(-halfW,Math.min(halfW,p[0]+S.rng.range(-.1,.1))),
      z:baseZ+p[1]+S.rng.range(-.1,.1),
      hp:st.hp, maxHp:st.hp, speed:st.speed*S.rng.range(.9,1.1), r:st.r,
      color:st.color, score:st.score, armored:st.armored,
      explode:st.explode, split:st.split, phase:S.rng.range(0,Math.PI*2),
      vx:0, vz:0, near:false, hit:0
    });
  });
  S.waveActive = true;
  setWaveLabel();
  if(S.waveIndex === CFG.spawn.waveCount-1) spawnBoss();
}

// =============================================================================
// BOSS — satu boss unik per varian arena (docs/10-level-variations.md)
// =============================================================================
function spawnBoss(){
  const v = CFG.variants[S.variant];
  const def = CFG.bosses.find(b=>b.id===v.boss) || CFG.bosses[0];
  // Model damage berubah total (auto-fire kini DPS utama), jadi HP boss
  // diskalakan lewat satu lever yang bisa diukur, bukan diedit satu per satu.
  const hpScale = ((CFG.balance && CFG.balance.bossHpScale) || 1) * S.diff;
  const mk = (x,z,hp,r)=>({x,z,hp:hp*hpScale,maxHp:hp*hpScale,r,
                           shieldAngle:Math.PI,hit:0,alive:true,deadAt:-1});

  let parts;
  if(def.id==='twin_warden') parts = [mk(-4,34,def.hp,1.8), mk(4,34,def.hp,1.8)];
  else parts = [mk(0,34,def.hp,2.4)];

  S.boss = { id:def.id, pattern:def.pattern, parts, t:0, vulnerable:true,
             totalHp:parts.reduce((a,p)=>a+p.hp,0), phase:0, nextAction:2 };
  el.bossBar.classList.add('on');
  el.bossName.textContent = def.id.replace(/_/g,' ').toUpperCase();
  flashPopup('BOSS');
  SFX.boom();
}

function tickBoss(dt, simTime){
  const B = S.boss; if(!B) return;
  B.t += dt;
  const alive = B.parts.filter(p=>p.alive);
  if(alive.length===0){ S.boss=null; el.bossBar.classList.remove('on'); return; }
  for(const p of B.parts) if(p.hit>0) p.hit -= dt;

  switch(B.pattern){
    case 'slow_descend_slam': {
      // COLOSSUS: turun lambat, slam tiap 4 detik. Perisai terbuka 1.5 s sesudah slam.
      const p = alive[0];
      p.z -= 0.22*dt;
      B.nextAction -= dt;
      if(B.nextAction <= 0){
        B.nextAction = 4.0; B.phase = 1.5;          // mulai jendela rentan
        explodeAt(p.x, p.z-2, 4.5, 0, 0);           // slam: hanya efek + shake
        S.shake = Math.max(S.shake, .45);
      }
      B.phase -= dt;
      B.vulnerable = B.phase > 0;
      break;
    }
    case 'mirror_pair_sidestep': {
      // TWIN WARDEN: bergerak cermin. Kalau satu mati dan pasangannya masih hidup
      // lebih dari 3 detik, yang mati bangkit dengan 30% HP.
      B.parts.forEach((p,i)=>{
        if(!p.alive) return;
        const dir = i===0 ? -1 : 1;
        p.x = dir*4 + dir*Math.sin(B.t*1.1)*3.2;
        p.z = 33 - Math.sin(B.t*0.5)*1.5;
      });
      for(const p of B.parts){
        if(p.alive || p.deadAt<0) continue;
        if(B.t - p.deadAt > 3 && B.parts.some(q=>q.alive)){
          p.alive = true; p.hp = p.maxHp*0.3; p.deadAt = -1;
          flashPopup('REVIVE'); SFX.boom();
        }
      }
      B.vulnerable = true;
      break;
    }
    case 'orbit_pull_pulse': {
      // SINGULARITY: mengorbit + menarik peluru. Perisai berputar; rentan dari sisi
      // berlawanan arah perisai.
      const p = alive[0];
      p.x = Math.sin(B.t*0.7)*5.5; p.z = 28 + Math.cos(B.t*0.7)*3;
      p.shieldAngle = (B.t*1.3) % (Math.PI*2);
      B.vulnerable = true;                      // ditentukan per-arah di damageBoss
      break;
    }
    case 'barrel_drop_charge': {
      // PYRO BARON: menjatuhkan barrel baru lalu charge ke arah player.
      const p = alive[0];
      B.nextAction -= dt;
      if(B.nextAction <= 0){
        B.nextAction = 3.5;
        S.obstacles.push({ kind:'barrel', x:p.x, z:p.z-3, bx:p.x, r:0.6, w:1,
                           travel:0, speed:0, phase:0, force:0, hp:1, alive:true });
        B.phase = 1.2;
      }
      if(B.phase > 0){ B.phase -= dt; p.z -= 3.2*dt; }      // charge
      else if(p.z < 33) p.z += 1.4*dt;                      // mundur
      p.x += Math.sin(B.t*0.9)*2.4*dt;
      p.x = Math.max(-7, Math.min(7, p.x));
      B.vulnerable = true;
      break;
    }
    case 'teleport_lane_swap': {
      // SHIFTER: teleport antar 3 lajur. Hanya rentan dari BELAKANG (peluru turun).
      const p = alive[0];
      B.nextAction -= dt;
      if(B.nextAction <= 0){
        B.nextAction = 2.5;
        const lanes = [-6, 0, 6];
        p.x = lanes[S.rng.int(0,3)];
        addFx(p.x, p.z, 'ripple');
      }
      p.z = 32 + Math.sin(B.t*0.8)*1.2;
      B.vulnerable = true;                      // arah diperiksa di damageBoss
      break;
    }
  }

  // Boss menembus garis pertahanan = kalah langsung.
  for(const p of alive) if(p.z <= CFG.arena.defenseLineZ + 1){ S.lives = 0; endRun(false); }

  const cur = B.parts.reduce((a,p)=>a+Math.max(0,p.hp),0);
  el.bossFill.style.width = (100*cur/B.totalHp).toFixed(1)+'%';
}

/** Damage boss dengan aturan perisai per pola. */
// Damage yang selalu masuk, berapa pun aturan perisai. Nilainya kecil: chain
// shot yang mengenai jendela rentan tetap jauh lebih cepat membunuh.
function damageBossChip(part, dmg){
  const B=S.boss; if(!B||!part.alive) return;
  part.hp -= dmg * CFG.squad.autoFire.bossChipFactor; part.hit = 0.1;
  if(part.hp<=0){ part.alive=false; part.deadAt=B.t; explodeAt(part.x,part.z,6,60,0);
    S.score+=2000; setScore(); flashPopup('BOSS DOWN'); }
}

function damageBoss(part, dmg, bdx, bdz){
  const B = S.boss; if(!B || !part.alive) return;

  let allowed = B.vulnerable;
  if(B.pattern === 'orbit_pull_pulse'){
    // rentan kalau peluru datang dari sisi berlawanan arah perisai
    const inc = Math.atan2(-bdz, -bdx);
    let d = Math.abs(((inc - part.shieldAngle + Math.PI*3) % (Math.PI*2)) - Math.PI);
    allowed = d < Math.PI/2;
  } else if(B.pattern === 'teleport_lane_swap'){
    allowed = bdz < -0.15;                      // hanya dari belakang (peluru turun)
  }

  if(!allowed){ part.hit = 0.1; return; }       // perisai menahan: memantul tanpa damage
  part.hp -= dmg; part.hit = 0.15;
  if(part.hp <= 0){
    part.alive = false; part.deadAt = B.t;
    explodeAt(part.x, part.z, 6, 60, 0);
    S.score += 2000; setScore();
    flashPopup('BOSS DOWN');
  }
}

// =============================================================================
// BULLET
// =============================================================================
function fire(){
  if(S.state!=='playing') return;
  initAudio();
  hideHint();

  // Tap saat riding = REM (constraint: tidak ada tombol terpisah)
  const riding = S.bullets.find(b=>b.riding&&b.alive);
  if(riding){ killBullet(riding,'brake'); return; }
  if(S.chainCharges<=0) return;

  const bc = CFG.bullet;
  // POSISI SQUAD ADALAH BIDIKANNYA. Chain shot selalu lurus ke depan, jadi
  // geometri pantulan ditentukan oleh di mana pemain berdiri saat menembak.
  // Satu sumbu kontrol memberi dua kedalaman: memilih gate sekaligus menyiapkan sudut.
  const a = 0;
  S.bullets.push({
    x:S.squadX, z:CFG.arena.playerSpawn.z + CFG.arena.muzzleOffset.z,
    px:S.squadX, pz:CFG.arena.playerSpawn.z,
    dx:Math.sin(a), dz:Math.cos(a), speed:bc.baseSpeed, spdMul:1, dmgMul:upMul('chainDamageMul'),
    bounces:bc.maxBounce + upAdd('bounceBudget'), bounceCount:0, riding:false,
    steer:0, steerMax:bc.steerMeterDuration, pending:0,
    alive:true, life:0, trail:[]
  });
  S.chainCharges--;
  SFX.shot();
  S.bounceLadder = 0;
}

function killBullet(b, reason){
  if(!b.alive) return;
  b.alive=false; b.riding=false;
  requestSlow(1);
  S.combo = 0;                       // combo reset saat peluru habis
  S.bounceLadder = 0;
  SFX.expire();
  setCombo();
}

/** Menggeser bidikan (mode manual). deltaDeg dari drag mendatar. */
function queueAim(deltaDeg){
  if(CFG.aim.mode !== 'manual') return;
  S.aimInput += deltaDeg;
}

function queueSteer(norm){
  const b = S.bullets.find(x=>x.riding&&x.alive&&x.steer>0);
  if(!b) return;
  const deg = Math.max(-1,Math.min(1,norm)) * CFG.bullet.steerAnglePerSwipe;
  b.pending = Math.max(-45, Math.min(45, b.pending+deg));
}

function tickBullet(b, dt){
  if(!b.alive) return;
  b.life += dt;
  if(b.life > 12){ killBullet(b,'timeout'); return; }
  b.px=b.x; b.pz=b.z;

  // --- steer meter (berjalan di waktu SIMULASI → slow-mo memperpanjangnya) ---
  if(b.riding && b.steer>0){
    b.steer -= dt;
    if(b.steer<=0){ b.steer=0; b.pending=0; requestSlow(1); }
  }
  // --- rate limit steering: maks 90°/detik ---
  if(Math.abs(b.pending)>1e-4 && b.riding && b.steer>0){
    const maxStep = CFG.bullet.steerMaxAnglePerSecond*dt;
    const step = Math.max(-maxStep, Math.min(maxStep, b.pending));
    b.pending -= step;
    [b.dx,b.dz] = Solver.rotate(b.dx,b.dz,step);
  }
  // --- gravity well ---
  for(const o of S.obstacles){
    if(o.kind!=='gravityWell'||!o.alive) continue;
    [b.dx,b.dz] = Solver.gravity(b.x,b.z,b.dx,b.dz,o.x,o.z,o.r,o.force,dt);
  }

  // --- substep sesuai jarak tempuh (anti-tunneling) ---
  const speed = b.speed*b.spdMul, travel = speed*dt;
  const sub = Math.max(1, Math.min(CFG.bullet.simulationSubsteps, Math.ceil(travel/0.5)));
  for(let s=0; s<sub && b.alive; s++) substep(b, dt/sub);

  b.trail.push([b.x,b.z]); if(b.trail.length>20) b.trail.shift();
}

function substep(b, dt){
  const rb = CFG.bullet.radius;
  let remaining = b.speed*b.spdMul*dt;

  for(let iter=0; iter<4 && remaining>1e-5; iter++){
    const ddx = b.dx*remaining, ddz = b.dz*remaining;
    let hit=null;

    // --- dinding samping ---
    const w = Solver.sweepWalls(b.x, ddx, rb, CFG.arena.xMin, CFG.arena.xMax);
    if(w) hit = {...w, kind:'wall', ref:null};

    // --- obstacle ---
    for(const o of S.obstacles){
      if(!o.alive) continue;
      if(o.kind==='gravityWell'||o.kind==='movingPlatform') continue;  // non-pemantul
      const rc = o.kind==='barrel'?0.6:o.r;
      const h = Solver.sweepCircle(b.x,b.z,ddx,ddz,rb,o.x,o.z,rc);
      if(h && (!hit||h.t<hit.t)) hit = {...h, kind:o.kind, ref:o};
    }

    // --- boss: selalu memantulkan (seperti bumper raksasa), damage tergantung perisai ---
    if(S.boss){
      for(const part of S.boss.parts){
        if(!part.alive) continue;
        const h = Solver.sweepCircle(b.x,b.z,ddx,ddz,rb,part.x,part.z,part.r);
        if(h && (!hit||h.t<hit.t)) hit = {...h, kind:'boss', ref:part};
      }
    }

    // --- crowd: musuh biasa DITEMBUS, berarmor MEMANTULKAN ---
    let touched=false, armorHit=null;
    for(const e of S.enemies){
      if(e.hp<=0) continue;
      const h = Solver.sweepCircle(b.x,b.z,ddx,ddz,rb,e.x,e.z,e.r);
      if(!h) continue;
      touched = true;
      if(e.armored && (!armorHit||h.t<armorHit.t)){ armorHit={...h, ref:e}; damageEnemy(e, 10*b.dmgMul*0.5); }
      else if(!e.armored && (!armorHit||h.t<=armorHit.t)) damageEnemy(e, 10*b.dmgMul);
    }
    if(armorHit && (!hit||armorHit.t<hit.t)) hit = {...armorHit, kind:'enemy'};

    // --- kontak musuh pertama → BULLET RIDING ---
    if(touched && !b.riding){
      b.riding = true; b.steer = b.steerMax;
      requestSlow(CFG.slowMo.crowdTimeScale);
      S.targetFov = 0.68;                 // 60° → 40°
      SFX.slow();
      addFx(b.x,b.z,'ripple');
    }

    // --- dinding atas: memantul (spawn gate tetap melewatkan musuh) ---
    const topAbsorbs = CFG.arena.walls.top.absorbsBullet !== false;
    if(!topAbsorbs && b.dz > 1e-6){
      const tTop = ((CFG.arena.zMax - rb) - b.z) / ddz;
      if(tTop >= 0 && tTop <= 1 && (!hit || tTop < hit.t)) hit = {t:tTop, nx:0, nz:-1, kind:'wall', ref:null};
    }

    if(!hit){
      b.x += ddx; b.z += ddz; remaining = 0;
      if(b.z < CFG.arena.zMin - rb || (topAbsorbs && b.z > CFG.arena.zMax + rb)) killBullet(b,'exit');
      return;
    }

    // --- pindah ke titik kontak + skin width ---
    const travelled = remaining*hit.t;
    b.x += b.dx*travelled; b.z += b.dz*travelled;
    remaining -= travelled;
    b.x += hit.nx*0.01; b.z += hit.nz*0.01;

    // --- barrel & shield wall menerima damage ---
    if(hit.kind==='boss'){ damageBoss(hit.ref, 10*b.dmgMul*3, b.dx, b.dz); }
    if(hit.ref && hit.kind==='barrel'){ detonate(hit.ref, 0); }
    if(hit.ref && hit.kind==='shieldWall'){
      if(hit.nz > 0){ hit.ref.hp -= 1; if(hit.ref.hp<=0) hit.ref.alive=false; }  // hanya dari belakang
    }

    if(!resolveBounce(b, hit)) return;
  }
}

function resolveBounce(b, hit){
  b.bounces--; b.bounceCount++;
  if(b.bounces < 0){ killBullet(b,'exhausted'); return false; }

  [b.dx,b.dz] = Solver.reflectSafe(b.dx,b.dz,hit.nx,hit.nz);

  // Stacking reward
  b.dmgMul *= CFG.bullet.damagePerBounce;
  b.spdMul = Math.min(b.spdMul*CFG.bullet.speedPerBounce, CFG.bullet.speedMultiplierCap);
  if(hit.kind==='bumper') b.dmgMul *= 1.05;

  S.bounceLadder++;
  SFX.bounce(S.bounceLadder);
  addFx(b.x,b.z,'bounce');
  S.shake = Math.max(S.shake, b.bounceCount>8?0.22:0.08);

  // Milestone tiap 5 bounce
  if(b.bounceCount % CFG.scoring.bounceMilestoneEvery === 0){
    S.shake = Math.max(S.shake, 0.18);
    flashPopup('BOUNCE x'+b.bounceCount);
  }
  // 3 pantulan terakhir → slow-mo ekstra
  if(b.bounces <= CFG.slowMo.finalBounceThreshold && b.bounces>0)
    requestSlow(CFG.slowMo.finalBounceTimeScale);

  return true;
}

// =============================================================================
// DAMAGE / EXPLOSION
// =============================================================================
function damageEnemy(e, dmg){
  if(e.hp<=0) return;
  e.hp -= dmg; e.hit = 0.12;
  if(e.hp>0) return;

  S.kills++; S.combo++;
  if(S.combo>S.bestCombo) S.bestCombo=S.combo;
  const gained = Math.round(e.score * (1 + S.combo*CFG.scoring.bounceMultiplierStep));
  S.score += gained;
  SFX.kill();
  addFx(e.x,e.z,'kill',e.color);
  // jx spreads stacked numbers sideways so simultaneous kills stay legible.
  // Derived from position, never from S.rng: drawing must not consume the
  // RNG stream or replays stop matching.
  if(S.floats.length<32) S.floats.push({x:e.x,z:e.z,t:0.8,v:gained,
    jx:((Math.round((e.x+e.z)*97)%11)-5)*0.16});

  if(CFG.scoring.comboMilestones.includes(S.combo)){ SFX.combo(); flashPopup('x'+S.combo); S.shake=Math.max(S.shake,.18); }
  if(CFG.scoring.killMilestones.includes(S.kills)){ S.score+=500; flashPopup(S.kills+' KILLS'); }

  if(e.split){
    for(let i=0;i<3;i++){ const a=i*Math.PI*2/3; const st=typeStats('grunt');
      S.enemies.push({id:++S.enemySeq, type:'grunt', x:e.x+Math.cos(a)*.6, z:e.z+Math.sin(a)*.6,
        hp:st.hp,maxHp:st.hp,speed:st.speed,r:st.r,color:st.color,score:st.score,
        armored:false,explode:false,split:false,phase:S.rng.range(0,6.283),vx:0,vz:0,near:false,hit:0}); }
        // ^ WAJIB S.rng, bukan Math.random: ini jalur simulasi (lihat docs/09 §B-6).
  }
  if(e.explode) explodeAt(e.x,e.z,2.5,30,1);
  setScore(); setCombo();
}

function explodeAt(x,z,r,dmg,depth){
  addFx(x,z,'boom'); SFX.boom(); S.shake=Math.max(S.shake,.32);
  for(const e of S.enemies){
    if(e.hp<=0) continue;
    const d=Math.hypot(e.x-x,e.z-z);
    if(d<=r) damageEnemy(e, dmg*(1-d/r));
  }
}

function detonate(o, depth){
  if(!o.alive) return;
  o.alive=false;
  const d = CFG.obstacleDefaults.barrel;
  explodeAt(o.x,o.z,d.explosionRadius,d.explosionDamage,depth);
  if(depth>=8) return;
  // Chain di-stagger 0.08s agar terbaca sebagai RANTAI, bukan satu ledakan.
  for(const other of S.obstacles){
    if(other===o||!other.alive||other.kind!=='barrel') continue;
    if(Math.hypot(other.x-o.x,other.z-o.z) > d.explosionRadius) continue;
    other.alive=false;
    setTimeout(()=>{ other.alive=true; detonate(other, depth+1); }, 80*(depth+1));
  }
}

// =============================================================================
// SLOW-MO (satu pemilik waktu)
// =============================================================================
// =============================================================================
// LAST WAR ATM — auto-fire & gate matematika
// =============================================================================

// Auto-fire: chip damage konstan yang tidak butuh input. Inilah dopamin dasar
// yang dipinjam dari Last War; chain shot yang memantul adalah lapisan skill.
function tickAutoFire(dt){
  const AF = CFG.squad.autoFire;
  if(S.troops > 0){
    // Cap first, then the card multiplier - same order as Godot.
    let rate = Math.min(AF.baseRatePerSec + AF.ratePerTroop*S.troops, AF.maxRatePerSec)
               * upMul('fireRateMul');
    S.autoCd -= dt;
    if(S.autoCd <= 0){
      S.autoCd = 1/Math.max(rate, .01);
      if(S.autoBullets.length < AF.maxActive){
        // Spread memakai S.rng supaya tetap deterministik.
        const sp = (S.rng.f()*2-1) * AF.spreadDeg * Math.PI/180;
        S.autoBullets.push({ x:S.squadX, z:CFG.arena.playerSpawn.z+CFG.arena.muzzleOffset.z,
                             vx:Math.sin(sp)*AF.projectileSpeed, vz:Math.cos(sp)*AF.projectileSpeed });
      }
    }
  }
  const halfW = CFG.arena.width/2;
  for(let i=S.autoBullets.length-1;i>=0;i--){
    const b=S.autoBullets[i];
    b.x += b.vx*dt; b.z += b.vz*dt;
    let gone = b.z > CFG.arena.zMax || b.x < -halfW || b.x > halfW;
    if(!gone){
      for(const e of S.enemies){
        if(e.hp<=0) continue;
        const dx=b.x-e.x, dz=b.z-e.z;
        if(dx*dx+dz*dz <= (e.r+AF.projectileRadius)*(e.r+AF.projectileRadius)){
          damageEnemy(e, AF.damage*upMul('autoDamageMul')); gone=true; break;
        }
      }
    }
    if(!gone && S.boss){
      for(const part of S.boss.parts){
        if(!part.alive) continue;
        const dx=b.x-part.x, dz=b.z-part.z;
        if(dx*dx+dz*dz <= (part.r+AF.projectileRadius)*(part.r+AF.projectileRadius)){
          // Chip menembus gerbang kerentanan supaya boss tidak pernah buntu.
          damageBossChip(part, AF.damage); gone=true; break;
        }
      }
    }
    if(gone) S.autoBullets.splice(i,1);
  }
}

function pickGateOp(wantNegative){
  const pool = CFG.gates.squadOps.filter(o=>o.positive !== wantNegative);
  if(!pool.length) return {op:'add', value:1, positive:true};
  let total=0; for(const o of pool) total+=o.weight;
  let roll = S.rng.f()*total;
  for(const o of pool){ roll -= o.weight; if(roll<0) return o; }
  return pool[pool.length-1];
}

function applyGateOp(v, o){
  if(o.op==='mul') return Math.floor(v*o.value);
  if(o.op==='add') return v + Math.round(o.value);
  if(o.op==='sub') return v - Math.round(o.value);
  if(o.op==='div') return Math.floor(v/Math.max(o.value,1));
  return v;
}

function tickGates(dt){
  const G = CFG.gates;
  if(!G.enabled) return;
  const simTime = S.tick*FIXED_DT;
  if(simTime >= S.gateNextAt){
    const left = pickGateOp(S.rng.f() < G.negativeSideChance*upMul('negativeSideChance'));
    // Sisi kanan selalu berlawanan polaritas: gate yang kedua pintunya
    // merugikan bukan pilihan, melainkan pungutan.
    const right = pickGateOp(left.positive);
    S.gates.push({ z:G.spawnZ, left, right, squadDone:false, bulletDone:false });
    S.gateNextAt = simTime + G.intervalSeconds + (S.rng.f()*2-1)*G.intervalJitter;
  }
  const pz = CFG.arena.playerSpawn.z;
  for(let i=S.gates.length-1;i>=0;i--){
    const g=S.gates[i];
    g.z -= G.descendSpeed*S.diff*dt;

    if(!g.squadDone && g.z <= pz + G.height){
      const side = S.squadX >= 0 ? g.right : g.left;
      const before = S.troops;
      S.troops = Math.max(0, Math.min(CFG.squad.maxTroops, applyGateOp(S.troops, side)));
      g.squadDone = true;
      const d = S.troops - before;
      addFloat(S.squadX, pz+1.2, (d>=0?'+':'')+d);
      if(d>=0){ SFX.pickup && SFX.pickup(); } else { S.shake=Math.max(S.shake,.2); }
      if(S.troops<=0){
        S.troops = CFG.squad.respawnTroops;
        if(S.invul<=0){
          S.invul=CFG.player.invulnerabilityAfterHit; S.lives--; flashScreen(); setHp();
          if(S.lives<=0) endRun(false);
        }
      }
    }

    // Gate juga berlaku ke peluru yang sedang ditunggangi — keputusan kedua
    // yang tidak dimiliki game referensinya.
    if(!g.bulletDone){
      const rb = S.bullets.find(b=>b.riding && b.alive);
      if(rb && Math.abs(rb.z - g.z) <= G.height){
        const side = rb.x >= 0 ? g.right : g.left;
        const E = G.bulletEffects;
        if(side.op==='mul'){
          rb.bounces = Math.min(Math.floor(rb.bounces*side.value), E.bounceBudgetCap);
          rb.dmgMul = Math.min(rb.dmgMul*1.1, E.damageMulCap);
        } else if(side.op==='add'){
          rb.bounces = Math.min(rb.bounces + Math.round(side.value*0.5), E.bounceBudgetCap);
        } else if(side.op==='sub'){
          rb.bounces = Math.max(rb.bounces - E.subBounceLoss, 1);
        } else if(side.op==='div'){
          rb.dmgMul = Math.max(rb.dmgMul*E.divDamageMul, 0.25);
        }
        g.bulletDone = true;
        addFloat(rb.x, rb.z, side.positive?'BULLET+':'BULLET-');
      }
    }
    if(g.z < -2) S.gates.splice(i,1);
  }
}

function addFloat(x,z,txt){ if(S.floats.length<40) S.floats.push({x,z,v:txt,t:0.9,raw:true,
  jx:((Math.round((x+z)*97)%11)-5)*0.16}); }

function requestSlow(target){
  if(S.holdSlow>0) return;
  if(target < S.targetTimeScale-0.001){ S.targetTimeScale = target; return; }
  S.targetTimeScale = target;
  if(target>=0.999) S.targetFov = 1;
}

// =============================================================================
// SIMULASI SATU TICK
// =============================================================================
function simulate(dt){
  // --- Interpolasi render ---
  // Pose tick sebelumnya disimpan di sini, bukan di renderer, karena hanya
  // simulasi yang tahu kapan sebuah tick dimulai. Dipakai draw() untuk
  // membaurkan dua tick, sehingga gerakan tetap halus di layar 120 Hz.
  // Peluru sengaja TIDAK diinterpolasi: lintasannya memantul, dan membaurkan
  // dua sisi pantulan akan memotong sudut yang justru jadi inti permainan.
  S.prevSquadX = S.squadX;
  for(const e of S.enemies){ e.rx = e.x; e.rz = e.z; }
  for(const g of S.gates){ g.rz = g.z; }
  if(S.boss) for(const p of S.boss.parts){ p.rx = p.x; p.rz = p.z; }

  // --- 0. turret ---
  // Dua mode dibandingkan di docs/12-aim-mode-comparison.md.
  // Keduanya memajukan sudut HANYA di dalam tick, jadi determinisme aman.
  const SQ = CFG.squad, halfWx = CFG.arena.width/2;
  // Input posisi di-queue lalu dikonsumsi DI DALAM tick, supaya replay identik.
  if(S.squadInput !== null){
    S.squadTargetX = Math.max(-halfWx+SQ.bodyRadius, Math.min(halfWx-SQ.bodyRadius, S.squadInput));
    S.squadInput = null;
  }
  {
    const d = S.squadTargetX - S.squadX, lim = SQ.moveSpeedMax*upMul('moveSpeedMul')*dt;
    S.squadX += Math.max(-lim, Math.min(lim, d*SQ.moveSmoothing*dt));
  }
  // Charge chain shot: waktu + bonus tiap kill.
  if(S.chainCharges < SQ.chainShot.maxCharges){
    S.chainCharge += dt * upMul('chargeRateMul') / SQ.chainShot.chargeSeconds;
    if(S.chainCharge >= 1){ S.chainCharge -= 1; S.chainCharges++; }
  }
  tickAutoFire(dt);
  tickGates(dt);

  const AIM = CFG.aim;
  if(AIM.mode !== 'manual'){
    // Sapuan ping-pong otomatis.
    S.aimAngle += S.aimDir * AIM.sweepSpeedDegPerSec * dt;
    if(S.aimAngle >  AIM.maxAngleDeg){ S.aimAngle =  AIM.maxAngleDeg; S.aimDir = -1; }
    if(S.aimAngle < -AIM.maxAngleDeg){ S.aimAngle = -AIM.maxAngleDeg; S.aimDir =  1; }
  }

  // --- 1. obstacle (moving platform deterministik dari simTime) ---
  const simTime = S.tick*FIXED_DT;
  for(const o of S.obstacles){
    if(o.kind!=='movingPlatform') continue;
    const p = o.travel*2, raw = (simTime*o.speed + o.phase*p) % (p*2);
    o.x = o.bx + (raw<p ? raw-o.travel : p*2-raw-o.travel);
  }

  // --- 2. crowd ---
  const halfW = CFG.arena.width/2, defZ = CFG.arena.defenseLineZ;
  for(let i=S.enemies.length-1;i>=0;i--){
    const e=S.enemies[i];
    if(e.hp<=0){ S.enemies.splice(i,1); continue; }
    if(e.hit>0) e.hit-=dt;

    let vx = Math.sin(simTime*CFG.spawn.swayFrequency*Math.PI*2 + e.phase)*CFG.spawn.swayAmplitude;
    let vz = -e.speed;

    // separation ringan (O(n·k) — di JS cukup sampling tetangga terdekat)
    for(let j=0;j<S.enemies.length;j+=1){
      const o=S.enemies[j]; if(o===e||o.hp<=0) continue;
      const dx=e.x-o.x, dz=e.z-o.z, sq=dx*dx+dz*dz;
      if(sq>0.49||sq<1e-6) continue;
      const d=Math.sqrt(sq); vx += (dx/d)*(1-d/0.7); vz += (dz/d)*(1-d/0.7);
    }
    // platform menghalangi musuh
    for(const o of S.obstacles){
      if(o.kind!=='movingPlatform'||!o.alive) continue;
      if(Math.abs(e.x-o.x)<o.w/2+e.r && Math.abs(e.z-o.z)<0.5 && vz<0) vz = 0;
    }

    e.vx=vx; e.vz=vz; e.x+=vx*dt; e.z+=vz*dt;
    e.x = Math.max(-halfW+e.r, Math.min(halfW-e.r, e.x));

    if(!e.near && e.z <= defZ+CFG.arena.nearMissBandZ){ e.near=true; }
    if(e.z <= defZ){
      S.enemies.splice(i,1); S.leaked++;
      // Invulnerability 1 detik: satu gelombang kebocoran = 1 HP, bukan 20 HP.
      // Tanpa ini, 3 musuh yang menembus bersamaan = game over instan.
      // Pasukan adalah HP: kebocoran memakan troop lebih dulu, nyawa hanya
      // hilang saat squad benar-benar habis.
      S.troops -= CFG.squad.troopLossPerLeak;
      if(S.troops <= 0){
        S.troops = CFG.squad.respawnTroops;
        if(S.invul <= 0){
          S.invul = CFG.player.invulnerabilityAfterHit;
          S.lives--; SFX.breach(); flashScreen(); S.shake=Math.max(S.shake,.3);
          setHp();
          if(S.lives<=0) endRun(false);
        }
      }
    }
  }

  if(S.invul > 0) S.invul -= dt;
  tickBoss(dt, simTime);

  // --- 3. peluru ---
  for(const b of S.bullets) tickBullet(b, dt);
  S.bullets = S.bullets.filter(b=>b.alive || b.trail.length>0);
  for(const b of S.bullets) if(!b.alive && b.trail.length) b.trail.shift();

  // --- 4. amunisi (auto-reload, tanpa tombol) ---
  if(S.ammo < CFG.bullet.magazine){
    S.reload -= dt;
    if(S.reload<=0){ S.ammo++; S.reload=CFG.bullet.autoReloadDelay; setAmmo(); }
  }

  // --- 5. wave logic ---
  S.waveTimer -= dt;
  const bossDown = !S.boss || S.boss.parts.every(p=>!p.alive);
  if(S.waveActive && S.enemies.length===0 && bossDown){
    S.waveActive=false;
    if(S.leaked===0){ S.coins+=CFG.scoring.perfectClearBonusCoins; banner('PERFECT CLEAR','#7CFF4D'); }
    S.leaked=0;
    if(S.waveIndex >= CFG.spawn.waveCount-1){ endRun(true); return; }
    S.waveTimer = Math.min(S.waveTimer, 1.6);
  }
  if(S.waveTimer<=0 && S.waveIndex < CFG.spawn.waveCount-1 && S.state==='playing'){
    S.waveIndex++; spawnWave();
    S.waveTimer = CFG.spawn.spawnInterval[Math.min(S.waveIndex,CFG.spawn.spawnInterval.length-1)];
  }

  // --- 6. fx & floating text ---
  for(let i=S.fx.length-1;i>=0;i--){ S.fx[i].t-=dt; if(S.fx[i].t<=0) S.fx.splice(i,1); }
  for(let i=S.floats.length-1;i>=0;i--){ S.floats[i].t-=dt; S.floats[i].z+=dt*1.5;
    if(S.floats[i].t<=0) S.floats.splice(i,1); }

  S.tick++;
}

function endRun(victory){
  S.state = victory?'victory':'defeat';
  banner(victory?'VICTORY':'GAME OVER', victory?CFG.variants[S.variant].theme.primary:'#FF1744');
  S.targetTimeScale = victory?0.35:0.2; S.holdSlow = 1.2;
  if(victory && S.stage+1 > META.unlocked) META.unlocked = Math.min(S.stage+1, stageCount());
  if(S.score > META.best) META.best = S.score;
  metaSave();
  if(!UI_READY) return;
  // Let the slow-mo and banner land before the meta screen takes over.
  setTimeout(()=>{
    if(S.state!=='victory' && S.state!=='defeat') return;  // already left this run
    if(victory && META.cards.length < (CFG.meta.cards||[]).length) showCards(S.stage);
    else showResult(victory);
  }, 1600);
}

// =============================================================================
// META SCREENS — stage map, card draft, result
// =============================================================================
function metaEl(){ return document.getElementById('meta'); }

function setHudVisible(on){
  if(el && el.hud && el.hud.classList) el.hud.classList.toggle('off', !on);
}

function hideMeta(){
  setHudVisible(true);
  const m = metaEl();
  if(!m) return;
  if(m.classList) m.classList.remove('on');
  m.style.display='none';
  m.innerHTML='';
}
function openMeta(html){
  setHudVisible(false);
  const m = metaEl();
  if(!m) return m;
  m.innerHTML = html;
  if(m.classList) m.classList.add('on');
  m.style.display='flex';
  return m;
}

function startStage(stage){
  S.stage = stage;
  hideMeta();
  loadVariant(variantForStage(stage));  // calls resetRun(), which applies cards
}

/** Jeda: satu-satunya jalan keluar dari run tanpa harus kalah dulu. */
function showPause(){
  if(S.state !== 'playing') return;
  S.state = 'paused';
  openMeta(`<div class="screen">
      <div class="spacer"></div>
      <h2 class="screenTitle">JEDA</h2>

function resumeRun(){

  hideMeta();

/** Bintang kesulitan: 1-3, dibaca sekilas, tanpa pemain harus menafsirkan "x1.24". */
function stageStars(stage){
  const d = difficultyForStage(stage);
  const n = d < 1.3 ? 1 : (d < 1.9 ? 2 : 3);
  return Array.from({length:3}, (_,i)=>`<span class="${i<n?'':'off'}">\u2605</span>`).join('');
}

function stageRailHtml(current){
  const total = stageCount();
  const highest = Math.min(META.unlocked, total-1);
  let out = '';
  for(let i=0;i<total;i++){
    const v = CFG.variants[variantForStage(i)], t = v.theme || {};
    const cleared = i < META.unlocked, locked = i > highest;
    const label = cleared ? 'CLEARED' : (locked ? 'LOCKED' : 'PLAY');
    out += `<button class="stageRow ${cleared?'cleared':''} ${locked?'locked':''} ${i===current?'cur':''}"
        data-s="${i}" ${locked?'disabled':''} title="${v.name}"
        style="--cardTop:${t.bgTop||'#0A1030'};--cardBot:${t.bgBottom||'#03060F'};--cardKey:${t.primary||'#00E5FF'}">
        <span class="art"></span>

        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <span class="stageMain">${v.name}</span>
        <span class="stageSub">\u2605 ${(difficultyForStage(i)).toFixed(2)}</span>
      </button>`;
  }
  return out;
}

function ownedCardsHtml(){
  const all = (CFG.meta && CFG.meta.cards) || [];
  if(!META.cards.length)
    return `<div class="empty">Belum ada upgrade.<br>Menangkan satu stage untuk menarik kartu pertama.</div>`;
  return META.cards.map(id=>{
    const c = all.find(x=>x.id===id) || { name:id, desc:'' };
    return `<div class="ownRow"><div class="badge">\u2726</div>
        <div><b>${c.name}</b><em>${c.desc||''}</em></div></div>`;
  }).join('');

/**
 * Kartu medan. Menekan satu kartu memainkan stage TERBARU yang memakai arena
 * itu, bukan stage pertamanya — kalau salah, pemain stage 14 dilempar balik ke
 * tutorial. Arena yang belum punya satu pun stage terbuka ditampilkan terkunci,
 * bukan disembunyikan.
 */
function latestStageForArena(i, current){
  let pick = -1;
  for(let s=0;s<=current;s++) if(variantForStage(s) === i) pick = s;
  return pick;
}

function arenaChipsHtml(current){
  return CFG.variants.map((v,i)=>{
    const t = v.theme || {};
    const stage = latestStageForArena(i, current);
    const locked = stage < 0;
    return `<button class="vbtn ${locked?'locked':''} ${i===S.variant&&!locked?'sel':''}"
        data-i="${i}" data-stage="${stage}" ${locked?'disabled':''} title="${v.description||''}"
        style="--cardTop:${t.bgTop||'#0A1030'};--cardBot:${t.bgBottom||'#03060F'};--cardKey:${t.primary||'#00E5FF'}">
        <span class="art"></span><b class="no">${i+1}</b><span class="nm">${v.name}</span></button>`;

}

    out += `<button class="volCell ${cls}" data-v="${i}" style="height:${72+i*14}px">`

// Drawn from a stage-derived seed, never from S.rng: pulling cosmetic draws out
// of the sim stream would shift every later roll and break replay determinism.
function drawOffers(stage){
  const all = (CFG.meta && CFG.meta.cards) || [];
  const want = (CFG.meta && CFG.meta.cardsOffered) || 3;
  let pool = all.filter(c=>META.cards.indexOf(c.id) < 0);
  if(pool.length < want) pool = all.slice();
  const rng = Rng(CFG.determinism.defaultSeed + stage*104729);
  const offers = [];
  while(offers.length < want && pool.length)
    offers.push(pool.splice(Math.floor(rng.f()*pool.length), 1)[0]);
  return offers;
}

function showCards(stage){
  S.state = 'menu';
  const offers = drawOffers(stage);
  const m = openMeta(`<div class="screen">
